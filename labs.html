<title>المختبرات الكيميائية التفاعلية | Bandar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><script src="https://unpkg.com/lucide@latest"></script><style>
:root{--bg:#f5faf9;--surface:#fff;--ink:#123d47;--muted:#58717a;--line:#d4e6e4;--primary:#0d7b70;--soft:#e5f4f0;--shadow:0 14px 34px rgba(18,61,71,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1a20;--surface:#13292f;--ink:#e5f3f1;--muted:#9bb8b8;--line:#28464a;--primary:#62c8b5;--soft:#173c3d;--shadow:0 14px 34px rgba(0,0,0,.24)}}
:root[data-theme="dark"]{--bg:#0b1a20;--surface:#13292f;--ink:#e5f3f1;--muted:#9bb8b8;--line:#28464a;--primary:#62c8b5;--soft:#173c3d;--shadow:0 14px 34px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding:22px 16px 56px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.back{display:inline-flex;gap:8px;align-items:center;color:var(--primary);text-decoration:none;font-weight:700}.eyebrow{color:var(--primary);font-weight:700;font-size:13px}h1{font-size:clamp(28px,5vw,44px);line-height:1.25;margin:6px 0 8px}.lead{color:var(--muted);margin:0;max-width:650px}.count{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:700;color:var(--primary)}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}#search{flex:1 1 240px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:8px 14px;font:inherit}.filter{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}.filter.active,.filter:hover{background:var(--primary);border-color:var(--primary);color:#fff}.group{margin:24px 0 34px}.group h2{font-size:21px;margin:0 0 12px;display:flex;gap:10px;align-items:center}.group h2::before{content:"";display:block;width:8px;height:26px;border-radius:8px;background:var(--primary)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.lab-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0;transition:transform .2s ease,border-color .2s ease}.lab-card:hover{transform:translateY(-3px);border-color:var(--primary)}.lab-icon{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--primary)}.lab-copy{display:grid;gap:3px;min-width:0}.lab-copy strong{font-size:16px;line-height:1.45}.lab-copy small{color:var(--muted);font-size:13px;line-height:1.55}.lab-copy em{font-style:normal;color:var(--primary);font-size:12px;font-weight:700;margin-top:5px}.empty{display:none;color:var(--muted);background:var(--surface);border:1px dashed var(--line);padding:20px;border-radius:14px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){body{padding-inline:12px}.grid{grid-template-columns:1fr}.lab-card{padding:14px}}@media(prefers-reduced-motion:reduce){.lab-card{transition:none}}
<style id="catalog-preview-style">.lab-card{position:relative;overflow:hidden}.lab-preview{display:grid;place-items:center;flex:0 0 68px;width:68px;height:68px;border-radius:14px;background:var(--soft);color:var(--primary);position:relative;overflow:hidden}.lab-preview.molecule::before,.lab-preview.molecule::after{content:"";position:absolute;width:34px;height:4px;border-radius:4px;background:currentColor;opacity:.5;transform:rotate(35deg)}.lab-preview.molecule::after{transform:rotate(-35deg)}.lab-preview.molecule i{width:18px;height:18px;border-radius:50%;background:var(--primary);box-shadow:-25px 17px 0 -3px var(--primary),25px 17px 0 -3px var(--primary);z-index:1}.lab-preview.periodic{display:grid;grid-template-columns:repeat(4,9px);grid-auto-rows:9px;gap:4px;align-content:center;justify-content:center}.lab-preview.periodic i{width:9px;height:9px;border-radius:2px;background:var(--primary);box-shadow:13px 0 0 var(--primary),26px 0 0 color-mix(in srgb,var(--primary) 55%,transparent),0 13px 0 color-mix(in srgb,var(--primary) 55%,transparent),13px 13px 0 var(--primary),26px 13px 0 color-mix(in srgb,var(--primary) 55%,transparent)}.lab-preview.bars{align-items:end;grid-template-columns:repeat(4,8px);gap:5px;padding:16px 12px}.lab-preview.bars i{width:8px;border-radius:4px 4px 2px 2px;background:var(--primary);height:22px}.lab-preview.bars i:nth-child(2){height:34px;background:color-mix(in srgb,var(--primary) 72%,#fff)}.lab-preview.bars i:nth-child(3){height:16px;background:var(--accent)}.lab-preview.bars i:nth-child(4){height:28px;background:var(--primary)}.lab-preview.equation{font-weight:800;font-size:12px;letter-spacing:.02em}.lab-preview.equation::after{content:"A + B → C";color:var(--primary)}.lab-preview .preview-dot{display:none}@media(max-width:500px){.lab-preview{flex-basis:54px;width:54px;height:54px}.lab-card{gap:9px}.lab-copy strong{font-size:15px}}.catalog-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.catalog-links .back{display:inline-block}@media(max-width:500px){.catalog-links{gap:8px}.catalog-links .back{font-size:13px}}</style></head><body><div class="wrap"><header class="top"><div><div class="catalog-links"><a class="back" href="index.html#gallery">← العودة إلى الصفحة الرئيسية</a><a class="back" href="references.html">المكتبة التعليمية</a></div><div class="eyebrow">CHEM · EDU / معرض التجارب</div><h1>جميع المختبرات التفاعلية</h1><p class="lead">استكشف المختبرات حسب الموضوع، أو ابحث عن المختبر المناسب مباشرة.</p></div><div class="count" aria-live="polite">—</div></header><div class="tools"><input aria-label="ابحث في المختبرات" id="search" placeholder="ابحث باسم المختبر أو الموضوع" type="search"/><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="molecular">الجزيئات والروابط</button><button class="filter" data-filter="elements">العناصر والتوزيع</button><button class="filter" data-filter="reactions">الأحماض والتفاعلات</button><button class="filter" data-filter="games">ألعاب صفية</button></div><main id="catalog"></main></div><script src="labs-data.js"></script><script>
const labs = Array.isArray(window.BANDAR_LABS) ? window.BANDAR_LABS : [];
const categories = Array.isArray(window.BANDAR_LAB_CATEGORIES) ? window.BANDAR_LAB_CATEGORIES : [];
const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));
const cardHtml = (lab) => `
  <a class="lab-card" data-category="${escapeHtml(lab.category)}" data-title="${escapeHtml(`${lab.title} ${lab.search || lab.description}`)}" href="labs/${encodeURIComponent(lab.id)}.html">
    <span aria-hidden="true" class="lab-preview ${escapeHtml(lab.preview)}"><i></i></span>
    <span class="lab-icon"><i data-lucide="${escapeHtml(lab.icon)}"></i></span>
    <span class="lab-copy"><strong>${escapeHtml(lab.title)}</strong><small>${escapeHtml(lab.description)}</small><em>${escapeHtml(lab.meta)}</em></span>
  </a>`;
const catalog = document.querySelector('#catalog');
catalog.innerHTML = categories.map((category) => {
  const items = labs.filter((lab) => lab.category === category.id);
  return `<section class="group" data-group="${escapeHtml(category.id)}"><h2>${escapeHtml(category.title)}</h2><div class="grid">${items.map(cardHtml).join('')}</div></section>`;
}).join('') + '<p class="empty" id="empty">لا توجد نتائج مطابقة للبحث.</p>';
document.querySelector('.count').textContent = `${labs.length} تجربة ولعبة`;
const search = document.querySelector('#search');
const buttons = [...document.querySelectorAll('.filter')];
const cards = [...document.querySelectorAll('.lab-card')];
const groups = [...document.querySelectorAll('.group')];
let filter = 'all';
function apply(){
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach((card) => {
    const ok = (filter === 'all' || card.dataset.category === filter) && (!q || card.dataset.title.toLowerCase().includes(q));
    card.hidden = !ok;
    if (ok) shown++;
  });
  groups.forEach((group) => { group.hidden = !group.querySelector('.lab-card:not([hidden])'); });
  document.querySelector('#empty').style.display = shown ? 'none' : 'block';
}
buttons.forEach((button) => button.onclick = () => {
  filter = button.dataset.filter;
  buttons.forEach((item) => item.classList.toggle('active', item === button));
  apply();
});
search.oninput = apply;
lucide.createIcons();
</script></body></html>
