<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>ملف الأداء الوظيفي | أ / بندر عويض العصيمي — مادة الكيمياء</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.js"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --radius:0.75rem;
    --background: oklch(0.99 0.005 95);
    --foreground: oklch(0.28 0.03 150);
    --card: oklch(1 0 0);
    --primary: oklch(0.62 0.17 148);
    --primary-foreground: oklch(0.99 0.005 95);
    --secondary: oklch(0.94 0.04 150);
    --muted-foreground: oklch(0.5 0.03 150);
    --accent: oklch(0.76 0.17 45);
    --accent-foreground: oklch(0.3 0.09 45);
    --border: oklch(0.91 0.02 150);
    --lab: oklch(0.55 0.15 165);
    --reaction: oklch(0.78 0.18 45);
    --molecule: oklch(0.88 0.05 150);
  }
  html{scroll-padding-top:80px;}
  *{box-sizing:border-box;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --background: oklch(0.16 0.025 150);
      --foreground: oklch(0.95 0.01 95);
      --card: oklch(0.21 0.035 150);
      --primary: oklch(0.72 0.14 150);
      --primary-foreground: oklch(0.14 0.03 150);
      --secondary: oklch(0.27 0.045 150);
      --muted-foreground: oklch(0.72 0.02 145);
      --accent: oklch(0.74 0.15 45);
      --accent-foreground: oklch(0.15 0.05 45);
      --border: oklch(1 0 0 / 12%);
      --lab: oklch(0.65 0.12 165);
      --reaction: oklch(0.76 0.15 45);
      --molecule: oklch(0.4 0.06 150);
    }
  }
  :root[data-theme="dark"]{
    --background: oklch(0.16 0.025 150);
    --foreground: oklch(0.95 0.01 95);
    --card: oklch(0.21 0.035 150);
    --primary: oklch(0.72 0.14 150);
    --primary-foreground: oklch(0.14 0.03 150);
    --secondary: oklch(0.27 0.045 150);
    --muted-foreground: oklch(0.72 0.02 145);
    --accent: oklch(0.74 0.15 45);
    --accent-foreground: oklch(0.15 0.05 45);
    --border: oklch(1 0 0 / 12%);
    --lab: oklch(0.65 0.12 165);
    --reaction: oklch(0.76 0.15 45);
    --molecule: oklch(0.4 0.06 150);
  }

  html,body{height:100%;margin:0;background:var(--background);color:var(--foreground);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;}
  .font-display{font-family:'Amiri','IBM Plex Sans Arabic',serif;font-weight:700;letter-spacing:0;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}
  @media (max-width:640px){ .wrap{padding:0 18px;} }
  svg.lucide{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;vertical-align:-0.15em;}

  /* header */
  header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--card) 95%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);}
  .site-inner{display:flex;align-items:center;gap:18px;padding:11px 24px;max-width:1000px;margin:0 auto;}
  .brand-link{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .brand-icon{display:flex;height:36px;width:36px;align-items:center;justify-content:center;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:18px;}
  .brand-name{font-family:'Amiri',serif;font-size:15px;}
  nav.top-nav{display:none;align-items:center;gap:2px;flex:1;overflow-x:auto;margin-inline-end:auto;}
  nav.top-nav a, nav.top-nav button{background:none;border:none;font-family:inherit;cursor:pointer;font-size:13px;color:var(--muted-foreground);padding:7px 13px;border-radius:999px;white-space:nowrap;}
  nav.top-nav a:hover, nav.top-nav button:hover{background:var(--accent);color:var(--accent-foreground);}
  select.mobile-nav{margin-inline-start:auto;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground);padding:8px 14px;font-size:13px;font-family:inherit;max-width:56vw;}
  @media (min-width:920px){
    nav.top-nav{display:flex;}
    select.mobile-nav{display:none;}
  }

  /* hero */
  section#top{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 40%, var(--background));}
  .side-deco{position:absolute;inset-block:0;display:none;align-items:center;pointer-events:none;opacity:.25;color:var(--foreground);}
  .side-deco.right{right:0;width:160px;justify-content:center;}
  .side-deco.left{left:0;width:160px;flex-direction:column;justify-content:center;gap:24px;}
  .side-deco svg{stroke-width:.75;}
  .side-deco.right svg{width:140px;height:140px;}
  .side-deco.left svg:first-child{width:64px;height:64px;}
  .side-deco.left svg:last-child{width:80px;height:80px;}
  @media (min-width:820px){ .side-deco{display:flex;} }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  .hero-inner{max-width:760px;margin:0 auto;padding:78px 24px;text-align:center;position:relative;z-index:1;}
  h1.hero-title{margin:0;font-size:clamp(34px,6.4vw,58px);line-height:1.25;}
  .hero-name-pill{display:inline-block;margin-top:22px;border-radius:20px;background:var(--primary);color:var(--primary-foreground);padding:12px 32px;font-size:clamp(19px,2.6vw,25px);font-family:'Amiri',serif;font-weight:700;box-shadow:0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent);}
  .hero-lede{max-width:560px;margin:22px auto 0;font-size:15.5px;line-height:1.85;color:var(--muted-foreground);}
  .hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 26px;font-size:14.5px;font-weight:600;}
  .btn.solid{background:var(--primary);color:var(--primary-foreground);box-shadow:0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent);}
  .btn.solid:hover{transform:translateY(-1px);}
  .btn.ghost{border:1px solid var(--border);background:var(--card);}
  .btn.ghost:hover{background:var(--secondary);}

  /* stats */
  section.stats{border-bottom:1px solid var(--border);background:var(--card);}
  .stats-grid{max-width:1000px;margin:0 auto;padding:38px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:640px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-card{border:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 45%, transparent);border-radius:22px;padding:22px 14px;text-align:center;}
  .stat-icon{display:flex;height:46px;width:46px;margin:0 auto;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);font-size:21px;}
  .stat-val{margin-top:14px;font-family:'Amiri',serif;font-size:27px;color:var(--primary);}
  .stat-lbl{margin-top:3px;font-size:12.5px;color:var(--muted-foreground);}

  /* lab pattern bg sections */
  .lab-pattern{background-image:
      radial-gradient(circle at 10% 20%, color-mix(in oklab, var(--lab) 14%, transparent) 0%, transparent 28%),
      radial-gradient(circle at 90% 80%, color-mix(in oklab, var(--reaction) 11%, transparent) 0%, transparent 30%),
      radial-gradient(circle at 50% 55%, color-mix(in oklab, var(--molecule) 10%, transparent) 0%, transparent 45%);}

  /* intro */
  section#intro .in{max-width:660px;margin:0 auto;padding:76px 24px;text-align:center;}
  section#intro h2{font-size:24px;margin:0;}
  .ayah{margin:26px 0 0;font-family:'Amiri';font-size:32px;line-height:2;color:var(--primary);}
  section#intro p.body{margin:26px 0 0;font-size:15.5px;line-height:1.9;color:var(--muted-foreground);}

  /* sections index */
  section#sections{border-block:1px solid var(--border);background:var(--card);}
  .sec-inner{max-width:1000px;margin:0 auto;padding:76px 24px;}
  .sec-head{text-align:center;}
  .sec-head h2{font-size:26px;margin:0 0 10px;}
  .sec-head p{font-size:14px;color:var(--muted-foreground);margin:0;}
  .cards-grid{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:880px){ .cards-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .cards-grid{grid-template-columns:1fr;} }
  .sec-card{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--background);border-radius:22px;padding:26px;transition:transform .18s ease, border-color .18s ease;}
  .sec-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--primary) 40%, var(--border));}
  .sec-card:hover .sec-icon{background:var(--primary);color:var(--primary-foreground);}
  .sec-top{display:flex;align-items:center;justify-content:space-between;}
  .sec-icon{display:flex;height:52px;width:52px;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);font-size:24px;transition:background .18s ease, color .18s ease;}
  .sec-num{font-family:'Amiri',serif;font-size:26px;color:color-mix(in srgb, var(--foreground) 22%, transparent);}
  .sec-card h3{margin:18px 0 0;font-size:18px;font-family:'Amiri',serif;font-weight:700;}
  .sec-card p{margin:10px 0 0;font-size:13px;line-height:1.65;color:var(--muted-foreground);}
  .sec-more{margin-top:16px;font-size:13px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:5px;}

  /* gallery */
  section#gallery .sec-inner{}
  .gallery-grid{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:880px){ .gallery-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .gallery-grid{grid-template-columns:1fr;} }
  .g-card{overflow:hidden;border:1px solid var(--border);background:var(--card);border-radius:22px;display:block;}
  .g-clickable{transition:transform .18s ease, border-color .18s ease;cursor:pointer;}

الة والقيم","flat":true,"text":"رؤية تربوية تسعى لجعل الكيمياء مادة محبوبة ومفهومة، ورسالة تبني طالبًا مفكرًا علميًا قادرًا على الاستكشاف.","subs":[{"title":"الرؤية","text":"أن أكون معلّم كيمياء متميزًا يُحفّز الطلاب على استكشاف عالم المواد والتفاعلات بفضول وإبداع.","ex":["تحويل المختبر إلى بيئة جذابة للاكتشاف","إعداد طلاب يفكرون علميًا"]},{"title":"الرسالة","text":"تقديم تعليم كيميائي يعتمد على التجربة والتفكير النقدي وربط العلم بالواقع المحيط.","ex":["ربط كل درس بتطبيق عملي","تشجيع الطلاب على طرح الأسئلة"]},{"title":"القيم","text":"الإخلاص في العمل، الدقة في التجربة، السلامة أولًا، التعاون، والتطوير المستمر.","ex":["الدقة في تسجيل نتائج التجارب","العمل الجماعي في المختبر"]},{"title":"الأهداف الاستراتيجية","text":"رفع التحصيل في الكيمياء، تنمية المهارات المختبرية، وإعداد طلاب للمنافسات العلمية.","ex":["رفع متوسط درجات الكيمياء","تشكيل فريق أولمبياد كيمياء"]}]},{"id":"ethics","n":"٠٢","icon":"scroll-text","title":"ميثاق أخلاقيات مهنة التعليم","flat":true,"text":"الالتزام بأخلاقيات المعلّم في التعامل مع الطلاب والزملاء وأولياء الأمور، مع مراعاة السلامة والسرية في بيئة المختبر.","subs":[{"title":"الالتزام بميثاق المهنة","text":"الاطلاع على ميثاق أخلاقيات مهنة التعليم والتوقيع عليه، والعمل بما ورد فيه من قيم ومبادئ.","ex":["حفظ نسخة من الميثاق في الملف الشخصي","مناقشة بنود الميثاق مع الزملاء"]},{"title":"السلامة المختبرية أولوية","text":"تعليم الطلاب قواعد السلامة قبل كل تجربة، وتوثيق أي حادثة بما يحفظ صحة الجميع.","ex":["اختبار سلامة غازات التجارب","تدريب الطلاب على استخدام المطفأة"]},{"title":"القدوة الحسنة","text":"تقديم نموذج يحتذى به في السلوك والمظهر والتعامل داخل المدرسة وخارجها.","ex":["الالتزام بزي المعلم","التعامل بهدوء أثناء الطوارئ"]},{"title":"سرية المعلومات","text":"المحافظة على خصوصية معلومات الطلاب وعدم إفشائها إلا في الحدود النظامية المسموحة.","ex":["عدم مشاركة النتائج في مجموعات عامة","حفظ سجلات الطلاب بشكل آمن"]}]},{"id":"cv","n":"٠٣","icon":"user-round","title":"السيرة الذاتية","flat":true,"text":"نبذة عن المؤهلات العلمية والخبرات في تدريس الكيمياء، والدورات التدريبية والمهارات المهنية التي تدعم الأداء التعليمي.","subs":[{"title":"المؤهلات العلمية","text":"الشهادات الجامعية والدراسات العليا والتخصص الأكاديمي في مجال الكيمياء وتعليمها.","ex":["بكالوريوس في الكيمياء / تعليم الكيمياء","دبلومات تخصصية في طرائق التدريس"]},{"title":"الخبرات التدريسية","text":"سنوات الخبرة في تدريس الكيمياء للمرحلة الثانوية، والمدارس التي تم العمل بها.","ex":["تدريس الكيمياء للصفوف الثانوية","إعداد خطط علاجية لمواد كيميائية صعبة"]},{"title":"الدورات التدريبية","text":"البرامج والدورات التدريبية والورش التطويرية التي تم اجتيازها لتنمية المهارات المهنية.","ex":["دورة أمن وسلامة المختبرات","ورشة استخدام المحاكاة في تدريس الكيمياء"]},{"title":"المهارات والجوائز","text":"المهارات التقنية والتربوية، وما حصل عليه من شهادات شكر وتكريم وجوائز.","ex":["إتقان برامج الرسم الجزيئي","حصول على شهادة شكر في اليوم العالمي للكيمياء"]}]},{"id":"duties","title":"أداء الواجبات الوظيفية","text":"الالتزام بالمهام الوظيفية اليومية من حضور وإشراف وتغطية حصص وأنشطة مسندة.","subs":[{"title":"الحضور والانصراف","text":"الانضباط في مواعيد الحضور والانصراف الرسمية للمدرسة.","ex":["توقيع سجل الحضور اليومي","الالتزام بالطابور الصباحي"]},{"title":"المناوبة والإشراف","text":"أداء مهام المناوبة اليومية والإشراف على الطلاب في الفسح والممرات.","ex":["جدول المناوبة الأسبوعي","صورة الإشراف على طابور الصباح"]},{"title":"الانتظار","text":"تغطية الحصص الانتظارية عند غياب أحد الزملاء.","ex":["سجل الحصص الانتظارية","تقرير حصة انتظار"]},{"title":"النشاط (تقرير حصة نشاط)","text":"توثيق تنفيذ حصة النشاط المدرسي بتقرير معتمد.","ex":["نموذج تقرير حصة نشاط","صورة من نشاط منفذ"]}],"n":"٠٤","icon":"clipboard-check"},{"id":"profcomm","title":"التفاعل مع المجتمع المهني","text":"المشاركة في أنشطة التطوير المهني وتبادل الخبرات مع الزملاء داخل المدرسة.","subs":[{"title":"الزيارات الصفية بين المعلمين","text":"تبادل الزيارات الصفية مع الزملاء للاستفادة من الممارسات التدريسية.","ex":["نموذج زيارة صفية","ملاحظات بعد الزيارة"]},{"title":"ملف النمو المهني","text":"توثيق مسار التطوير الذاتي والدورات والإنجازات المهنية.","ex":["شهادات الدورات التدريبية","خطة النمو المهني الفردية"]},{"title":"مجتمعات التعلم المهني","text":"المشاركة الفاعلة في مجتمعات التعلم المهني داخل المدرسة.","ex":["محضر اجتماع مجتمع التعلم","عرض قُدّم داخل المجتمع المهني"]}],"n":"٠٥","icon":"users"},{"id":"parents","title":"التفاعل مع أولياء الأمور","text":"بناء قنوات تواصل فعّالة مع أولياء الأمور لدعم متابعة الطلاب وتحصيلهم.","subs":[{"title":"إرسال الخطة الأسبوعية","text":"إطلاع أولياء الأمور على خطة الأسبوع الدراسي عبر المنصة أو قنوات الواتساب.","ex":["لقطة من رسالة الخطة الأسبوعية","نشر الخطة عبر منصة مدرستي"]},{"title":"إشعار ولي أمر الطالب المتميز","text":"تعزيز التميز بإشعار الأسرة عبر المنصة أو جوال المدرسة أو الموجه الطلابي.","ex":["إشعار تميز عبر جوال المدرسة","رسالة شكر لولي الأمر"]},{"title":"إعداد خطة علاجية وإيصال الملاحظات","text":"وضع خطة علاجية للطالب المتعثر وإطلاع ولي أمره على ملاحظات المتابعة.","ex":["نموذج خطة علاجية","رسالة ملاحظات لولي الأمر"]}],"n":"٠٦","icon":"messages-square"},{"id":"strategies","title":"التنويع في استراتيجيات التدريس","text":"توظيف استراتيجيات تدريس متنوعة تراعي الفروق الفردية بين الطلاب.","subs":[{"title":"استخدام استراتيجيات متنوعة","text":"تنفيذ استراتيجيات تدريس متعددة كالتعلم التعاوني والاستقصاء والعصف الذهني.","ex":["خطة درس موضّح فيها الاستراتيجية","صورة من تنفيذ نشاط تعاوني"]},{"title":"تقرير مختصر عن الحصة","text":"توثيق سير الحصة والاستراتيجية المستخدمة بتقرير موجز.","ex":["نموذج تقرير حصة","ملاحظات ما بعد الحصة"]},{"title":"تصوير أوراق الطلاب أو السبورة","text":"توثيق نواتج التعلم بصور من أعمال الطلاب أو محتوى السبورة.","ex":["صورة سبورة الدرس","نماذج من أوراق الطلاب"]}],"n":"٠٧","icon":"lightbulb"},{"id":"techtools","title":"توظيف تقنيات ووسائل التعلم المناسبة","text":"الاستفادة من الوسائل والتقنيات الحديثة لتقريب المفاهيم للطلاب.","subs":[{"title":"إعداد أوراق عمل تفاعلية","text":"تصميم أوراق عمل تفاعلية تدعم تفاعل الطالب مع المحتوى.","ex":["نموذج ورقة عمل تفاعلية","صورة تنفيذ الطلاب لها"]},{"title":"استخدام وسائل مساعدة لتنفيذ الدروس","text":"توظيف وسائل تعليمية ملموسة كالخرائط والبطاقات لدعم الشرح.","ex":["صورة خريطة مفاهيم مستخدمة","بطاقات تعليمية بالحصة"]},{"title":"استخدام أجهزة الكمبيوتر","text":"الاستفادة من الحاسب الآلي في عرض المحتوى وتفعيل الدرس.","ex":["صورة استخدام جهاز العرض","عرض تقديمي للدرس"]},{"title":"منصة مدرستي","text":"توظيف منصة مدرستي في التفاعل مع الطلاب ومتابعة الواجبات.","ex":["لقطة من نشاط على المنصة","تكليف واجب عبر مدرستي"]}],"n":"٠٨","icon":"monitor"},{"id":"assessment","title":"تنويع أساليب التقويم","text":"استخدام أدوات تقويم متعددة لقياس تحصيل الطلاب من زوايا مختلفة.","subs":[{"title":"ملف إنجاز الطالب","text":"توثيق أعمال الطالب وتطوره الدراسي عبر ملف إنجاز مستمر.","ex":["نموذج ملف إنجاز","محتويات ملف طالب"]},{"title":"تطبيق اختبارات ورقية وإلكترونية","text":"تنويع أدوات الاختبار بين الورقي والإلكتروني حسب طبيعة المحتوى.","ex":["نموذج اختبار ورقي","لقطة اختبار إلكتروني"]},{"title":"المهام الأدائية","text":"تكليف الطلاب بمهام أدائية تقيس تطبيق المهارة عمليًا.","ex":["نموذج مهمة أدائية","صورة تنفيذ المهمة"]},{"title":"المشاريع الطلابية","text":"إشراك الطلاب في مشاريع تطبيقية تعزز الفهم العميق للمحتوى.","ex":["صورة من مشروع طلابي","نموذج تقييم المشروع"]}],"n":"٠٩","icon":"chart-bar"},{"id":"results","title":"تحسين نتائج المتعلمين","text":"خطط ومبادرات ترفع من مستوى تحصيل الطلاب وتراعي الفروق الفردية بينهم.","subs":[{"title":"أنشطة إثرائية للطلاب المتميزين","text":"أنشطة إضافية تنمّي قدرات الطلاب المتميزين وتوسّع مداركهم.","ex":["نموذج نشاط إثرائي","صورة تنفيذ النشاط"]},{"title":"خطط علاجية للطلاب المتعثرين","text":"برامج دعم مركّزة لمعالجة جوانب الضعف لدى الطلاب المتعثرين.","ex":["نموذج خطة علاجية","سجل متابعة الطالب"]}],"n":"١٠","icon":"trending-up"},{"id":"planning","title":"إعداد وتنفيذ خطة التعلم","text":"توثيق التخطيط الفصلي والأسبوعي وربطه بالتنفيذ الفعلي داخل الصف.","subs":[{"title":"نسخة من توزيع المنهج","text":"توزيع محتوى المقرر على أسابيع الفصل الدراسي.","ex":["نسخة من توزيع المنهج المعتمد"]},{"title":"نسخة من الخطة الأسبوعية","text":"خطة تنفيذ الدروس أسبوعيًا بما يتوافق مع توزيع المنهج.","ex":["نسخة من الخطة الأسبوعية"]},{"title":"نسخة من تحضير الدروس","text":"تحضير كتابي أو إلكتروني لكل درس قبل تنفيذه.","ex":["نموذج تحضير درس"]},{"title":"صور للواجبات عبر المنصة","text":"توثيق تكليف ومتابعة الواجبات المرسلة عبر منصة مدرستي.","ex":["لقطة واجب على المنصة"]},{"title":"أوراق عمل محلولة","text":"نماذج من أوراق عمل الطلاب بعد حلها كدليل على تنفيذ الخطة.","ex":["صورة ورقة عمل محلولة"]}],"n":"١١","icon":"calendar-check"},{"id":"environment","title":"تهيئة بيئة تعليمية","text":"توفير بيئة صفية منظمة وآمنة ومحفزة على التعلم.","subs":[{"title":"انضباط الصف أثناء الحصة","text":"ضبط سلوك الطلاب وتنظيم مشاركتهم أثناء سير الحصة.","ex":["صورة الصف أثناء الحصة"]},{"title":"المعمل وغرفة مصادر التعلم","text":"تجهيز المعمل أو غرفة مصادر التعلم واستثمارها في الدروس العملية.","ex":["صورة تنفيذ درس بالمعمل"]},{"title":"وسائل حسية (بطاقات - خريطة مفاهيم - سبورة إضافية - إلخ)","text":"توظيف وسائل حسية ملموسة تدعم فهم الطلاب للمفاهيم.","ex":["صورة بطاقات تعليمية","خريطة مفاهيم بالصف"]}],"n":"١٢","icon":"school"},{"id":"classroom","title":"الإدارة الصفية","text":"ممارسات إدارية تحافظ على انضباط الصف وفاعلية التعلم.","subs":[{"title":"كشف المتابعة للطلاب","text":"تسجيل ملاحظات دورية على أداء وسلوك الطلاب.","ex":["نموذج كشف متابعة"]},{"title":"تنوع الأسئلة أثناء الدرس","text":"طرح أسئلة متدرجة الصعوبة تحفّز التفكير وتقيس الفهم.","ex":["نموذج أسئلة صفية"]},{"title":"متابعة الحضور والغياب","text":"رصد حضور وغياب الطلاب أولًا بأول والتعامل مع حالات التأخر.","ex":["سجل الحضور والغياب"]}],"n":"١٣","icon":"layout-dashboard"},{"id":"diagnostics","title":"تحليل نتائج المتعلمين وتشخيص مستوياتهم","text":"تحليل بيانات الطلاب لتحديد نقاط القوة والضعف وتصنيف مستوياتهم.","subs":[{"title":"تنفيذ الاختبار التشخيصي وتحليل نتائجه","text":"تطبيق اختبار تشخيصي في بداية الفصل وتحليل نتائجه لتحديد المستوى العام.","ex":["نموذج الاختبار التشخيصي","تقرير تحليل النتائج"]},{"title":"تطبيق اختبار أنماط التعلم وتصنيف الطلاب","text":"التعرف على أنماط تعلم الطلاب وتصنيفهم لتصميم أنشطة تناسبهم.","ex":["نموذج اختبار أنماط التعلم"]},{"title":"تحليل نتائج الاختبارات","text":"دراسة نتائج الاختبارات الدورية لتحديد مدى تحقق نواتج التعلم.","ex":["تقرير تحليل نتائج اختبار"]}],"n":"١٤","icon":"chart-line"}]}</script>
<script>
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const ORIGINAL_DATA_TEXT = document.getElementById('siteData').textContent;
const siteData = JSON.parse(ORIGINAL_DATA_TEXT);
var { teacher, highlights, galleryItems, contactChannels, sections } = siteData;

const ic = (name, extra) => `<i data-lucide="${name}" ${extra||''}></i>`;

function filterGallery(kind, button){
  document.querySelectorAll('[data-gallery-card]').forEach(card=>{card.hidden=kind!=='all'&&card.dataset.galleryKind!==kind;});
  document.querySelectorAll('.gallery-filter').forEach(b=>b.classList.toggle('active',b===button || b.dataset.galleryFilter===kind));
}
function searchGallery(value){
  const q=String(value||'').trim().toLowerCase();
  document.querySelectorAll('[data-gallery-card]').forEach(card=>{card.hidden=!!q&&!card.textContent.toLowerCase().includes(q);});
  document.querySelectorAll('.gallery-filter').forEach(b=>b.classList.remove('active'));
}

function renderHome(){
  const statsHtml = [
    {icon:'briefcase-business',value:(siteData.highlights||[])[0]?.value||'15+',label:'سنوات الخبرة'},
    {icon:'folder-check',value:'—',label:'شواهد سحابية',id:'cloudEvidenceStat'},
    {icon:'flask-conical',value:(siteData.highlights||[])[1]?.value||'50+',label:'تجربة مختبرية'},
    {icon:'sparkles',value:(siteData.highlights||[])[3]?.value||'8',label:'مبادرة علمية'}
  ].map(h=>`
    <div class="stat-card${h.id?' stat-cloud':''}">
      <div class="stat-icon">${ic(h.icon)}</div>
      <div class="stat-val"${h.id?` id="${h.id}"`:''}>${h.value}</div>
      <div class="stat-lbl">${h.label}</div>
    </div>`).join('');

  const cardsHtml = (siteData.sections||[]).map(s=>`
    <a class="sec-card" href="#d-${s.id}">
      <div class="sec-top">
        <span class="sec-icon">${ic(s.icon)}</span>
        <span class="sec-num">${s.n}</span>
      </div>
      <h3>${s.title}</h3>
      <p>${s.text}</p>
      <span class="sec-more">عرض التفاصيل ${ic('arrow-left')}</span>
    </a>`).join('');

  const featuredLinks = new Set(['daily-molecules','elements']);
  const galleryHtml = (siteData.galleryItems||[]).filter(g=>featuredLinks.has(g.link)).map((g,index)=>{
    const count = g.evidence ? g.evidence.length : 0;
    const displayTitle = g.link==='elements' ? 'الجدول الدوري' : g.title;
    const displayCaption = g.link==='elements' ? 'استكشاف الجدول الدوري والعناصر والمركبات' : g.caption;
    const kind = g.link ? 'interactive' : g.id ? 'visual' : 'experiment';
    const label = kind==='interactive' ? displayTitle : kind==='visual' ? 'معرض بصري' : 'تجربة كيميائية';
    const hint = g.link
      ? `<span class="g-open">${ic('external-link')} فتح الصفحة المستقلة</span>`
      : g.id
        ? `<span class="g-open">${ic('images')} ${count ? `عرض الصور (${count})` : 'استعراض المعرض'}</span>`
        : `<span class="g-open">${ic('flask-conical')} استكشاف التجربة</span>`;
    const thumb = g.link==='daily-molecules'
      ? `<div class="g-thumb mini-thumb" aria-label="معاينة جزيء"><div class="mini-molecule"><span class="bond b1"></span><span class="bond b2"></span><span class="bond b3"></span><span class="atom center">C</span><span class="atom oxygen o1">O</span><span class="atom oxygen o2">O</span><span class="atom hydrogen h1">H</span><span class="atom hydrogen h2">H</span></div><span class="g-type">${displayTitle}</span></div>`
      : g.link==='elements'
        ? `<div class="g-thumb mini-thumb" aria-label="معاينة مصغرة للجدول الدوري"><div class="mini-periodic"><span>H</span><span class="empty"></span><span class="empty"></span><span class="empty"></span><span class="empty"></span><span class="empty"></span><span class="empty"></span><span>He</span><span>Li</span><span>Be</span><span class="p2">B</span><span class="p3">C</span><span class="p2">N</span><span class="p2">O</span><span class="p3">F</span><span>Ne</span><span>Na</span><span>Mg</span><span class="p2">Al</span><span class="p3">Si</span><span class="p2">P</span><span class="p2">S</span><span class="p3">Cl</span><span>Ar</span></div><span class="g-type">${displayTitle}</span></div>`
        : `<div class="g-thumb">${ic(g.icon)}<span class="g-type">${label}</span></div>`;
    const inner = `${thumb}
      <div class="g-body"><h3>${displayTitle}</h3><p>${displayCaption}</p>${hint}</div>`;
    const attrs=`data-gallery-card data-gallery-kind="${kind}" data-gallery-link="${g.link||''}" style="--item-index:${index}"`;
    if(g.link){
      const labHref = `labs/${g.link}.html`;
      return `<a class="g-card g-clickable" ${attrs} href="${labHref}">${inner}</a>`;
    }
    if(g.id) return `<a class="g-card g-clickable" ${attrs} href="#gp-${g.id}">${inner}</a>`;
    return `<div class="g-card" ${attrs}>${inner}</div>`;
  }).join('');

  const contactHtml = (siteData.contactChannels||[]).map(c=>{
    const value = c.icon==='mail'
      ? `<a href="mailto:${c.value}" aria-label="إرسال بريد إلى ${c.value}">${c.value}</a>`

let cloudRows = [];
let cloudEvidenceTotal = null;
function updateCloudEvidenceStat(){const el=document.getElementById('cloudEvidenceStat');if(el)el.textContent=cloudEvidenceTotal===null?'—':String(cloudEvidenceTotal);}
const cloudEsc = x => String(x ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const cloudFmt = bytes => {const n=Number(bytes)||0;return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;};
function cloudRowsFor(s, sub){return cloudRows.filter(r=>r.section_id===s.id && r.branch_title===sub.title);}
let cloudEvidenceFilter = 'all';
function cloudFileKind(row){const type=String(row.file_type||'').toLowerCase();if(type.startsWith('image/'))return 'image';if(type.startsWith('video/'))return 'video';if(type.includes('pdf'))return 'pdf';return 'other';}
function cloudKindLabel(kind){return kind==='image'?'صور':kind==='video'?'فيديو':kind==='pdf'?'PDF':'ملفات';}
function cloudEvidenceCard(row){const kind=cloudFileKind(row),url=cloudEsc(row.file_url),title=cloudEsc(row.title||row.file_path||'شاهد');let preview=kind==='image'?`<img src="${url}" alt="${title}" loading="lazy">`:kind==='video'?`<video src="${url}" controls preload="metadata" aria-label="${title}"></video>`:`${ic(kind==='pdf'?'file-text':'paperclip')}`;return `<a class="cloud-evidence-link" data-kind="${kind}" href="${url}" target="_blank" rel="noopener"><div class="cloud-evidence-preview">${preview}</div><div class="cloud-evidence-meta"><strong>${title}</strong><small>${cloudEsc(cloudKindLabel(kind))} · ${cloudFmt(row.file_size||0)}</small><span class="cloud-evidence-open">فتح الشاهد ↗</span></div></a>`;}
function setCloudEvidenceFilter(filter){cloudEvidenceFilter=filter;document.querySelectorAll('.cloud-filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.querySelectorAll('.cloud-evidence-link').forEach(card=>{card.hidden=filter!=='all'&&card.dataset.kind!==filter;});}
function cloudEvidenceHtml(s, sub){const rows=cloudRowsFor(s,sub);if(!rows.length)return '';const counts=rows.reduce((a,r)=>{const k=cloudFileKind(r);a[k]=(a[k]||0)+1;return a;},{});const filters=[['all','الكل',rows.length],['image','صور',counts.image||0],['pdf','PDF',counts.pdf||0],['video','فيديو',counts.video||0],['other','ملفات',counts.other||0]].filter(x=>x[0]==='all'||x[2]);return `<div class="cloud-evidence"><h4>${ic('cloud')} الشواهد المرفوعة لهذا المؤشر</h4><div class="cloud-evidence-tools">${filters.map(([k,label,count])=>`<button type="button" class="cloud-filter ${cloudEvidenceFilter===k?'active':''}" data-filter="${k}" onclick="setCloudEvidenceFilter('${k}')">${label} (${count})</button>`).join('')}</div><div class="cloud-evidence-list">${rows.map(cloudEvidenceCard).join('')}</div></div>`;}

      if(labKeys.includes(key)){
        location.href = `labs/${key}.html`;
        return;

      content.innerHTML = renderHome();

    } else if(hash.startsWith("#gp-")){
      const item = galleryItems.find(g=>g.id===hash.slice(4));
      content.innerHTML = item ? renderGalleryPhotos(item) : renderHome();
    } else if(hash.startsWith("#b-")){
      const rest = hash.slice(3);
      const li = rest.lastIndexOf('-');
      const s = sections.find(x=>x.id===rest.slice(0,li));
      const i = parseInt(rest.slice(li+1),10);

      if(["#intro","#sections","#gallery","#contact"].includes(hash)){

    content.querySelectorAll('.sub-card,.sub-flat,.g-card,.sec-card').forEach((el,i)=>el.style.setProperty('--item-index',i));
    content.classList.remove('route-enter');
    void content.offsetWidth;

function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.75;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

async function handleFileUpload(input, sid, si){
  const file = input.files && input.files[0];
  if(!file) return;
  const s = sections.find(x=>x.id===sid);
  if(!s) return;
  const sub = s.subs[si];
  sub.evidence = sub.evidence || [];
  let item = null;
  if(file.type === 'application/pdf'){
    const src = await readAsDataURL(file);
    item = { type:'pdf', label: (file.name||'ملف').replace(/\.pdf$/i,''), filename: file.name || 'شاهد.pdf', src };
  } else if(file.type.indexOf('image/')===0){
    const src = await resizeImageFile(file);
    if(src) item = { type:'image', label:'صورة شاهد', src };
  } else {
    alert('الرجاء اختيار صورة أو ملف PDF.');
    return;
  }
  if(item){ sub.evidence.push(item); route(); }
}

function removeEvidence(sid, si, idx){
  const s = sections.find(x=>x.id===sid);
  if(!s) return;
  const sub = s.subs[si];
  if(sub.evidence) sub.evidence.splice(idx,1);
  route();
}

async function handleGalleryUpload(input, gid){
  const file = input.files && input.files[0];
  if(!file) return;
  const item = galleryItems.find(g=>g.id===gid);
  if(!item) return;
  if(file.type.indexOf('image/')!==0){
    alert('الرجاء اختيار صورة.');
    return;
  }
  const src = await resizeImageFile(file);
  if(!src) return;
  item.evidence = item.evidence || [];
  item.evidence.push({ type:'image', label: item.title, src });
  route();
}

function removeGalleryEvidence(gid, idx){
  const item = galleryItems.find(g=>g.id===gid);
  if(!item || !item.evidence) return;
  item.evidence.splice(idx,1);
  route();
}

async function exportSite(){
  const newDataText = JSON.stringify(siteData).replace(/<\/script/gi, '<\\/script');
  const newHtml = ORIGINAL_HTML.replace(ORIGINAL_DATA_TEXT, newDataText);
  const filename = 'performance-portfolio.html';

  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename, data: newHtml });
        return;
      }
    } catch(err) {
      if (err && err.code === 'declined') return;
      console.warn('downloads capability failed, falling back:', err);
    }
  }

  const blob = new Blob([newHtml], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

  function setProgress(value){var n=Math.max(0,Math.min(100,value));if(bar)bar.style.width=n+'%';if(label)label.textContent=Math.round(n)+'%';}
  function finishWhenReady(){if(!ready||revealed)return;var wait=Math.max(0,minimum-(Date.now()-started));window.setTimeout(finish,wait);}
  function finish(){if(revealed)return;revealed=true;setProgress(100);if(title){title.textContent='تم تجهيز الموقع';title.classList.add('site-loader-ready');}window.setTimeout(function(){if(!loader){if(document.body)document.body.classList.remove('site-booting');return;}loader.classList.add('done');window.setTimeout(function(){if(document.body)document.body.classList.remove('site-booting');},620);},260);}
  setProgress(8);window.setTimeout(function(){if(!ready)setProgress(35);},260);window.setTimeout(function(){if(!ready)setProgress(62);},760);window.setTimeout(function(){if(!ready)setProgress(85);},1300);
  document.addEventListener('DOMContentLoaded',function(){if(!ready)setProgress(35);},{once:true});
  window.addEventListener('load',function(){ready=true;finishWhenReady();},{once:true});
  window.setTimeout(function(){ready=true;finishWhenReady();},maximum);
})();</script></body></html>
