tage{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}\n.panel h2{margin:0 0 10px;font-size:1.05rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}\n.span2{grid-column:1/-1}\n@media (max-width:860px){.stage{grid-template-columns:1fr}}\n\n.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}\n.tile{width:132px;height:150px;border-radius:14px;border:3px solid;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;direction:ltr}\n.tile .tz{font-weight:700;font-size:1.1rem}\n.tile .tsym{font-size:3.6rem;font-weight:700;line-height:1;text-align:center}\n.tile .tname{text-align:center;direction:rtl;font-size:.95rem}\n.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.92rem}\n.facts div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:3px}\n.facts b{font-weight:700}\n.valbox{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:10px 14px}\n.vnum{font-size:2.6rem;font-weight:700;line-height:1}\n.vdots{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}\n.vdots i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.08)}\n.note{margin:4px 0 0;font-size:.84rem;color:var(--muted)}\n@media (max-width:480px){.hero{grid-template-columns:1fr}.tile{margin:auto}}\n\n.cfg{display:flex;flex-wrap:wrap;gap:6px;font-size:1.3rem;font-weight:500;align-items:center}\n.ss{padding:1px 8px;border-radius:7px;border:1.5px solid transparent}\n.ss.bs{background:var(--s-soft)}.ss.bp{background:var(--p-soft)}.ss.bd{background:var(--d-soft)}.ss.bf{background:var(--f-soft)}\n.ss.val{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}\n.ss sup{font-size:.62em;font-weight:700}\n.core{padding:1px 8px;border-radius:7px;background:var(--ink);color:var(--panel);font-weight:700}\n.row-l{font-size:.85rem;color:var(--muted);margin:14px 0 4px}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:.8rem;font-weight:500}\n.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer}\n.seg button.on{background:var(--ink);color:var(--panel)}\n.exc{margin-top:12px;border:1.5px dashed var(--d);border-radius:12px;padding:10px 12px;font-size:.9rem;display:none}\n.exc.show{display:block}\n.exc .cfg{font-size:1rem}\n\n.orbs{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;min-height:60px}\n.sub{display:flex;flex-direction:column;align-items:center;gap:3px}\n.boxes{display:flex}\n.box{width:30px;height:36px;border:1.6px solid var(--ink);border-left-width:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-style:normal;font-weight:700}\n.box:first-child{border-left-width:1.6px}\n.box i{font-style:normal;line-height:1}\n.sub.bs .box i{color:var(--s)}.sub.bp .box i{color:var(--p)}.sub.bd .box i{color:var(--d)}.sub.bf .box i{color:var(--f)}\n.sub.val .box{border-color:var(--gold);background:var(--gold-soft)}\n.sub .lbl{font-size:.85rem;font-weight:700}\n.corebox{height:36px;display:flex;align-items:center;padding:0 10px;border-radius:8px;background:var(--ink);color:var(--panel);font-weight:700}\n.pop{display:inline-block;animation:pop .45s ease-out}\n@keyframes pop{0%{transform:translateY(-14px) scale(1.6);opacity:0}100%{transform:none;opacity:1}}\n.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.rules span{font-size:.8rem;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}\n.rules b{color:var(--ink)}\n.counter{font-size:.9rem;font-weight:700;color:var(--d);min-height:1.4em}\n\n.bohrwrap svg,.aufwrap svg,.lewiswrap svg{width:100%;height:auto;display:block}\n.bohrwrap{max-width:360px;margin:auto}\n.orbit{transform-box:fill-box;transform-origin:center;animation:spin linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n.shells{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;direction:ltr}\n.shells span{border:1px solid var(--line);border-radius:8px;padding:1px 9px;font-size:.85rem}\n.shells span.out{border-color:var(--gold);background:var(--gold-soft);font-weight:700}\n.aufwrap{max-width:320px;margin:auto}\n.cellp rect{animation:pulse .6s ease-out}\n@keyframes pulse{0%{stroke-width:5}100%{stroke-width:1.5}}\n.lewiswrap{max-width:220px;margin:auto}\n.muted{color:var(--muted);font-size:.9rem}\n\n.quiz .qhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}\n.score{display:flex;gap:12px;font-size:.9rem}\n.score b{font-size:1.1rem}\n.qtext{font-size:1.15rem;font-weight:700;margin:10px 0}\n.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n@media (max-width:520px){.opts{grid-template-columns:1fr}}\n.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;font-size:1.05rem;text-align:center}\n.opt:hover:not(:disabled){border-color:var(--ink)}\n.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}\n.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}\n.opt .cfg{font-size:1rem;justify-content:center}\n.fb{margin-top:10px;min-height:1.6em;font-size:.95rem}\n.qbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}\n\n#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}\n#confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.2s ease-out forwards}\n@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}\n@media (prefers-reduced-motion:reduce){.orbit,.pop,.cellp rect,#confetti i{animation:none!important}.el,.el:hover{transition:none}}\n</style>\n</head>\n<body>\n<div id=\"confetti\"></div>\n<div class=\"wrap\">\n  <header>\n    <div>\n      <h1>مختبر التوزيع الإلكتروني</h1>\n      <p class=\"sub-h\">اختر أي عنصر من الجدول، ثم شاهد كيف تستقر إلكتروناته في المستويات</p>\n    </div>\n    <div class=\"controls\">\n      <button class=\"btn\" id=\"prev\" aria-label=\"العنصر السابق\">‹ السابق</button>\n      <input type=\"range\" id=\"slider\" min=\"1\" max=\"118\" value=\"26\" dir=\"ltr\" aria-label=\"العدد الذري\">\n      <button class=\"btn\" id=\"next\" aria-label=\"العنصر التالي\">التالي ›</button>\n      <input class=\"search\" id=\"search\" placeholder=\"ابحث: Fe أو حديد أو 26\" aria-label=\"بحث عن عنصر\">\n    </div>\n  </header>\n\n  <section class=\"ptable\" aria-label=\"الجدول الدوري\">\n    <div class=\"grid\" id=\"grid\"></div>\n    <div class=\"legend\">\n      <span style=\"--c:var(--s)\">الفئة s</span>\n      <span style=\"--c:var(--p)\">الفئة p</span>\n      <span style=\"--c:var(--d)\">الفئة d (الانتقالية)</span>\n      <span style=\"--c:var(--f)\">الفئة f (الانتقالية الداخلية)</span>\n      <span style=\"--c:var(--gold)\">إلكترونات التكافؤ</span>\n    </div>\n  </section>\n\n  <div class=\"stage\">\n    <section class=\"panel\">\n      <div class=\"hero\" id=\"hero\"></div>\n    </section>\n\n    <section class=\"panel\">\n      <h2>نموذج بور (المستويات الرئيسية)</h2>\n      <div class=\"bohrwrap\" id=\"bohr\"></div>\n      <div class=\"shells\" id=\"shells\"></div>\n    </section>\n\n    <section class=\"panel span2\">\n      <h2>الترميز الإلكتروني\n        <span class=\"seg\" id=\"orderSeg\"><button data-v=\"fill\" class=\"on\">ترتيب الملء</button><button data-v=\"shell\">حسب المستويات</button></span>\n      </h2>\n      <div class=\"row-l\">التوزيع الكامل</div>\n      <div class=\"cfg ltr\" id=\"cfgFull\"></div>\n      <div class=\"row-l\">ترميز الغاز النبيل (المختصر)</div>\n      <div class=\"cfg ltr\" id=\"cfgNoble\"></div>\n      <div class=\"exc\" id=\"exc\"></div>\n    </section>\n\n    <section class=\"panel span2\">\n      <h2>التمثيل بالمربعات (رسم الأوربيتالات)\n        <span style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n          <span class=\"seg\" id=\"orbSeg\"><button data-v=\"full\">كامل</button><button data-v=\"core\">مختصر</button></span>\n          <button class=\"btn primary\" id=\"play\">▶ شاهد الملء خطوة بخطوة</button>\n        </span>\n      </h2>\n      <div class=\"counter\" id=\"counter\"></div>\n      <div class=\"orbs ltr\" id=\"orbs\"></div>\n      <div class=\"rules\">\n        <span><b>مبدأ أوفباو:</b> تُملأ المستويات الأقل طاقة أولاً</span>\n        <span><b>مبدأ باولي:</b> إلكترونان على الأكثر في الأوربيتال بغزلين متعاكسين</span>\n        <span><b>قاعدة هوند:</b> إلكترونات منفردة في الأوربيتالات المتساوية قبل الازدواج</span>\n      </div>\n    </section>\n\n    <section class=\"panel\">\n      <h2>مخطط أوفباو (اتبع الأسهم القطرية)</h2>\n      <div class=\"aufwrap\" id=\"auf\"></div>\n    </section>\n\n    <section class=\"panel\">\n      <h2>تمثيل لويس النقطي</h2>\n      <div class=\"lewiswrap\" id=\"lewis\"></div>\n    </section>\n\n    <section class=\"panel span2 quiz\">\n      <div class=\"qhead\">\n        <h2 style=\"margin:0\">تحدَّ نفسك</h2>\n        <div class=\"score\"><span>النقاط: <b id=\"sc\">0</b>/<b id=\"tot\">0</b></span><span>السلسلة: <b id=\"stk\">0</b> 🔥</span></div>\n      </div>\n      <div class=\"qtext\" id=\"qtext\"></div>\n      <div class=\"opts\" id=\"opts\"></div>\n      <div class=\"fb\" id=\"fb\"></div>\n      <div class=\"qbtns\">\n        <button class=\"btn primary\" id=\"nextQ\">سؤال جديد</button>\n        <button class=\"btn\" id=\"openQ\">افتح العنصر في المختبر</button>\n      </div>\n    </section>\n  </div>\n</div>\n\n<script>\nconst SYM=\"H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og\".split(\" \");\nconst NAMES=(\"هيدروجين|هيليوم|ليثيوم|بيريليوم|بورون|كربون|نيتروجين|أكسجين|فلور|نيون|\"+\n\"صوديوم|مغنيسيوم|ألومنيوم|سيليكون|فوسفور|كبريت|كلور|أرجون|بوتاسيوم|كالسيوم|\"+\n\"سكانديوم|تيتانيوم|فاناديوم|كروم|منجنيز|حديد|كوبلت|نيكل|نحاس|خارصين|\"+\n\"جاليوم|جرمانيوم|زرنيخ|سيلينيوم|بروم|كريبتون|روبيديوم|سترونشيوم|إتريوم|زركونيوم|\"+\n\"نيوبيوم|موليبدنوم|تكنيشيوم|روثينيوم|روديوم|بلاديوم|فضة|كادميوم|إنديوم|قصدير|\"+\n\"أنتيمون|تيلوريوم|يود|زينون|سيزيوم|باريوم|لانثانوم|سيريوم|براسيوديميوم|نيوديميوم|\"+\n\"بروميثيوم|ساماريوم|يوروبيوم|جادولينيوم|تيربيوم|ديسبروسيوم|هولميوم|إربيوم|ثوليوم|إتربيوم|\"+\n\"لوتيشيوم|هافنيوم|تنتالوم|تنجستن|رينيوم|أوزميوم|إريديوم|بلاتين|ذهب|زئبق|\"+\n\"ثاليوم|رصاص|بزموت|بولونيوم|أستاتين|رادون|فرانسيوم|راديوم|أكتينيوم|ثوريوم|\"+\n\"بروتكتينيوم|يورانيوم|نبتونيوم|بلوتونيوم|أمريسيوم|كوريوم|بركيليوم|كاليفورنيوم|أينشتاينيوم|فيرميوم|\"+\n\"مندليفيوم|نوبليوم|لورنسيوم|رذرفورديوم|دوبنيوم|سيبورجيوم|بوريوم|هاسيوم|مايتنريوم|دارمشتاتيوم|\"+\n\"رونتجينيوم|كوبرنيسيوم|نيهونيوم|فليروفيوم|موسكوفيوم|ليفرموريوم|تينيسين|أوجانيسون\").split(\"|\");\n\nconst ORDER=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];\nconst LL=\"spdf\",CAP=[2,6,10,14];\nconst KEYS=ORDER.map(([n,l])=>n+LL[l]);\nconst EXC={24:{\"4s\":1,\"3d\":5},29:{\"4s\":1,\"3d\":10},41:{\"5s\":1,\"4d\":4},42:{\"5s\":1,\"4d\":5},44:{\"5s\":1,\"4d\":7},45:{\"5s\":1,\"4d\":8},46:{\"5s\":0,\"4d\":10},47:{\"5s\":1,\"4d\":10},\n57:{\"4f\":0,\"5d\":1},58:{\"4f\":1,\"5d\":1},64:{\"4f\":7,\"5d\":1},78:{\"6s\":1,\"5d\":9},79:{\"6s\":1,\"5d\":10},\n89:{\"5f\":0,\"6d\":1},90:{\"5f\":0,\"6d\":2},91:{\"5f\":2,\"6d\":1},92:{\"5f\":3,\"6d\":1},93:{\"5f\":4,\"6d\":1},96:{\"5f\":7,\"6d\":1},103:{\"6d\":0,\"7p\":1}};\nconst CORES=[[86,\"Rn\"],[54,\"Xe\"],[36,\"Kr\"],[18,\"Ar\"],[10,\"Ne\"],[2,\"He\"]];\nconst SHELL=\"KLMNOPQ\";\n\nfunction aufbauMap(Z){const m={};let r=Z,last=null;for(const [n,l] of ORDER){if(r<=0)break;const c=Math.min(CAP[l],r);m[n+LL[l]]=c;r-=c;last=n+LL[l];}return {m,last};}\nfunction actualMap(Z){const a={...aufbauMap(Z).m};if(EXC[Z])Object.assign(a,EXC[Z]);return a;}\nfunction listOf(map,byShell){const a=ORDER.map(([n,l])=>({n,l,k:n+LL[l],c:map[n+LL[l]]||0})).filter(x=>x.c>0);if(byShell)a.sort((x,y)=>x.n-y.n||x.l-y.l);return a;}\nfunction coreOf(Z){for(const [cz,s] of CORES)if(cz<Z)return {cz,s};return null;}\nfunction subtractCore(map,cz){const cm=aufbauMap(cz).m,r={};for(const k in map){const v=map[k]-(cm[k]||0);if(v>0)r[k]=v;}return r;}\n\nfunction pos(Z){\n  if(Z===1)return {period:1,group:1};if(Z===2)return {period:1,group:18};\n  if(Z<=10)return {period:2,group:Z<=4?Z-2:Z+8};\n  if(Z<=18)return {period:3,group:Z<=12?Z-10:Z};\n  if(Z<=36)return {period:4,group:Z-18};\n  if(Z<=54)return {period:5,group:Z-36};\n  if(Z<=86){if(Z<=56)return {period:6,group:Z-54};if(Z<=70)return {period:6,group:null,frow:0,fcol:Z-57};return {period:6,group:Z-68};}\n  if(Z<=88)return {period:7,group:Z-86};if(Z<=102)return {period:7,group:null,frow:1,fcol:Z-89};return {period:7,group:Z-100};\n}\nfunction info(Z){\n  const p=pos(Z),{last}=aufbauMap(Z),block=last.slice(-1),P=p.period;\n  const vk=block===\"s\"?[P+\"s\"]:block===\"p\"?[P+\"s\",P+\"p\"]:block===\"d\"?[P+\"s\",(P-1)+\"d\"]:[P+\"s\"];\n  const map=actualMap(Z);const val=vk.reduce((a,k)=>a+(map[k]||0),0);\n  return {Z,sym:SYM[Z-1],name:NAMES[Z-1],...p,block,vk,val,map,last,exc:!!EXC[Z]};\n}\nconst BLK={s:\"bs\",p:\"bp\",d:\"bd\",f:\"bf\"};\n\nfunction ssHTML(list,vk){return list.map(x=>`<span class=\"ss ${BLK[LL[x.l]]}${vk&&vk.includes(x.k)?\" val\":\"\"}\">${x.k}<sup>${x.c}</sup></span>`).join(\"\");}\nfunction nobleHTML(Z,map,byShell,vk){const c=coreOf(Z);return (c?`<span class=\"core\">[${c.s}]</span>`:\"\")+ssHTML(listOf(c?subtractCore(map,c.cz):map,byShell),vk);}\n\nfunction orbHTML(map,o){\n  let h=\"\",m=map;\n  if(o.core){h+=`<div class=\"sub\"><div class=\"corebox\">[${o.core.s}]</div><span class=\"lbl\">اللب</span></div>`;m=subtractCore(map,o.core.cz);}\n  for(const x of listOf(m,false)){\n    const n=2*x.l+1;let newIdx=-1,newDn=false;\n    if(o.newKey===x.k){if(x.c<=n)newIdx=x.c-1;else{newIdx=x.c-n-1;newDn=true;}}\n    let b=\"\";for(let i=0;i<n;i++){const up=x.c>i,dn=x.c>n+i;\n      b+=`<span class=\"box\">${up?`<i class=\"${newIdx===i&&!newDn?\"pop\":\"\"}\">↑</i>`:\"\"}${dn?`<i class=\"${newIdx===i&&newDn?\"pop\":\"\"}\">↓</i>`:\"\"}</span>`;}\n    h+=`<div class=\"sub ${BLK[LL[x.l]]}${o.vk&&o.vk.includes(x.k)?\" val\":\"\"}\"><div class=\"boxes\">${b}</div><span class=\"lbl\">${x.k}</span></div>`;\n  }\n  return h;\n}\n\nfunction bohrSVG(map,I){\n  const sh={};for(const k in map){const n=+k[0];sh[n]=(sh[n]||0)+map[k];}\n  const ns=Object.keys(sh).map(Number).filter(n=>sh[n]>0),maxN=Math.max(1,...ns),outer=Math.max(...ns);\n  const step=Math.min(36,118/maxN);let g=\"\";\n  for(const n of ns){\n    const r=26+n*step,c=sh[n],er=c>18?2.6:c>8?3.5:4.6,isOut=I&&n===outer;\n    let e=\"\";for(let i=0;i<c;i++){const a=2*Math.PI*i/c-Math.PI/2;e+=`<circle cx=\"${(r*Math.cos(a)).toFixed(1)}\" cy=\"${(r*Math.sin(a)).toFixed(1)}\" r=\"${er}\" style=\"fill:${isOut?\"var(--gold)\":\"var(--d)\"};stroke:var(--panel);stroke-width:1\"/>`;}\n    g+=`<g class=\"orbit\" style=\"animation-duration:${8+n*5}s;animation-direction:${n%2?\"normal\":\"reverse\"}\"><circle r=\"${r}\" style=\"fill:none;stroke:${isOut?\"var(--gold)\":\"var(--line)\"};stroke-width:${isOut?2:1.3}\" ${isOut?'stroke-dasharray=\"5 4\"':\"\"}/>${e}</g>`;\n  }\n  const Z=I?I.Z:Object.values(map).reduce((a,b)=>a+b,0);\n  return `<svg viewBox=\"-160 -160 320 320\" role=\"img\" aria-label=\"نموذج بور\">${g}<circle r=\"22\" style=\"fill:var(--s)\"/><text y=\"-2\" text-anchor=\"middle\" style=\"fill:#fff;font-weight:700;font-size:14px\">${I?I.sym:\"\"}</text><text y=\"13\" text-anchor=\"middle\" style=\"fill:#fff;font-size:10px\" direction=\"ltr\">${I?\"+\"+I.Z:Z+\" e⁻\"}</text></svg>`;\n}\nfunction shellsHTML(map,I){\n  const sh={};for(const k in map){const n=+k[0];sh[n]=(sh[n]||0)+map[k];}\n  const ns=Object.keys(sh).map(Number).filter(n=>sh[n]>0),outer=Math.max(...ns);\n  return ns.map(n=>`<span class=\"${I&&n===outer?\"out\":\"\"}\">${SHELL[n-1]} (n=${n}): ${sh[n]}</span>`).join(\"\");\n}\n\nfunction aufbauSVG(map,newKey){\n  const cx=l=>34+l*66,cy=n=>22+(n-1)*38;let lines=\"\",cells=\"\";const gr={};\n  ORDER.forEach(([n,l])=>{(gr[n+l]=gr[n+l]||[]).push([n,l]);});\n  let ux=-66,uy=38;const len=Math.hypot(ux,uy);ux/=len;uy/=len;\n  for(const s in gr){const g=gr[s],[n1,l1]=g[0],[n2,l2]=g[g.length-1];\n    lines+=`<line x1=\"${cx(l1)-ux*30}\" y1=\"${cy(n1)-uy*30}\" x2=\"${cx(l2)+ux*28}\" y2=\"${cy(n2)+uy*28}\" style=\"stroke:var(--muted);stroke-width:1.6;opacity:.55\" marker-end=\"url(#ah)\"/>`;}\n  for(const [n,l] of ORDER){const k=n+LL[l],c=map[k]||0,fr=c/CAP[l],col=`var(--${LL[l]})`;\n    cells+=`<g class=\"${k===newKey?\"cellp\":\"\"}\"><rect x=\"${cx(l)-23}\" y=\"${cy(n)-13}\" width=\"46\" height=\"26\" rx=\"7\" style=\"fill:${col};fill-opacity:${c?0.2+0.8*fr:0.06};stroke:${col};stroke-width:1.5\"/><text x=\"${cx(l)}\" y=\"${cy(n)+5}\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:${fr>0.55?\"#fff\":\"var(--ink)\"}\">${k}${c?`<tspan dy=\"-6\" style=\"font-size:9px\">${c}</tspan>`:\"\"}</text></g>`;}\n  return `<svg viewBox=\"0 0 262 280\" direction=\"ltr\" role=\"img\" aria-label=\"مخطط أوفباو\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/></marker></defs>${lines}${cells}</svg>`;\n}\n\nfunction lewisHTML(I){\n  if(I.block!==\"s\"&&I.block!==\"p\")return `<p class=\"muted\">يُستخدم تمثيل لويس النقطي عادةً لعناصر المجموعات الرئيسية (الفئتين s و p). ${I.name} من الفئة ${I.block}، لذا يُكتفى بتوزيعه الإلكتروني.</p>`;\n  const sides=[0,0,0,0];if(I.Z===2)sides[0]=2;else for(let i=0;i<I.val;i++)sides[i%4]++;\n  const cx=90,cy=75,w=I.sym.length>1?38:26;let d=\"\";\n  const P=[[cx,cy-36,1,0],[cx+w,cy,0,1],[cx,cy+36,1,0],[cx-w,cy,0,1]];\n  sides.forEach((c,i)=>{const [x,y,hx,hy]=P[i];const offs=c===1?[0]:c===2?[-7,7]:[];offs.forEach(o=>{d+=`<circle cx=\"${x+hx*o}\" cy=\"${y+hy*o}\" r=\"5\" style=\"fill:var(--gold);stroke:var(--ink);stroke-width:1\"/>`;});});\n  return `<svg viewBox=\"0 0 180 150\"><text x=\"${cx}\" y=\"${cy+15}\" text-anchor=\"middle\" style=\"font-size:44px;font-weight:700;fill:var(--ink)\">${I.sym}</text>${d}</svg><p class=\"muted\" style=\"text-align:center\">${I.val} ${I.val===1?\"إلكترون تكافؤ\":\"إلكترونات تكافؤ\"} حول رمز العنصر</p>`;\n}\n\nfunction excMsg(Z){\n  if(Z===24||Z===42)return \"المستوى الفرعي d نصف الممتلئ (d⁵) أكثر استقراراً، فينتقل إلكترون من s إلى d.\";\n  if(Z===29||Z===47||Z===79)return \"المستوى الفرعي d الممتلئ (d¹⁰) أكثر استقراراً، فينتقل إلكترون من s إلى d.\";\n  if(Z===46)return \"ينتقل إلكترونا 5s إلى 4d ليصبح ممتلئاً تماماً (4d¹⁰).\";\n  return \"التوزيع الفعلي مُقاس تجريبياً ويختلف عن المتوقع بسبب تقارب طاقات المستويات الفرعية.\";\n}\n\nconst $=id=>document.getElementById(id);\nlet Z=26,orderMode=\"fill\",orbMode=null,timer=null;\n\n// build table\n(function(){const g=$(\"grid\");let h=\"\";\n  for(let z=1;z<=118;z++){const p=pos(z),b=aufbauMap(z).last.slice(-1);\n    const st=p.frow!==undefined?`grid-row:${9+p.frow};grid-column:${4+p.fcol}`:`grid-row:${p.period};grid-column:${p.group}`;\n    h+=`<button class=\"el ${BLK[b]}\" data-z=\"${z}\" style=\"${st}\" title=\"${NAMES[z-1]}\" aria-label=\"${NAMES[z-1]} ${z}\"><span class=\"z\">${z}</span><span class=\"sy\">${SYM[z-1]}</span></button>`;}\n  h+=`<div class=\"flabel\" style=\"grid-row:9\">اللانثانيدات</div><div class=\"flabel\" style=\"grid-row:10\">الأكتينيدات</div>`;\n  g.innerHTML=h;g.addEventListener(\"click\",e=>{const b=e.target.closest(\".el\");if(b)select(+b.dataset.z);});\n})();\n\nfunction select(z){stop();Z=Math.max(1,Math.min(118,z));render();}\nfunction stop(){if(timer){clearInterval(timer);timer=null;}$(\"play\").textContent=\"▶ شاهد الملء خطوة بخطوة\";$(\"counter\").textContent=\"\";}\n\nfunction render(){\n  const I=info(Z),byShell=orderMode===\"shell\";\n  document.querySelectorAll(\".el\").forEach(b=>b.classList.toggle(\"sel\",+b.dataset.z===Z));\n  $(\"slider\").value=Z;\n  const grp=I.group?I.group:(I.frow===0?\"اللانثانيدات\":\"الأكتينيدات\");\n  const note=I.block===\"d\"?\"في العناصر الانتقالية تُعد إلكترونات ns و (n−1)d إلكترونات تكافؤ.\"\n    :I.block===\"f\"?\"المستوى الخارجي فيه إلكترونان، وحالة التأكسد الشائعة لهذه العناصر +3.\"\n    :`إلكترونات المستوى الخارجي n = ${I.period}.`;\n  $(\"hero\").innerHTML=`\n    <div class=\"tile\" style=\"border-color:var(--${I.block});background:var(--${I.block}-soft)\"><span class=\"tz\">${I.Z}</span><span class=\"tsym\">${I.sym}</span><span class=\"tname\">${I.name}</span></div>\n    <div class=\"facts\">\n      <div><span>العدد الذري</span><b>${I.Z}</b></div>\n      <div><span>عدد الإلكترونات</span><b>${I.Z}</b></div>\n      <div><span>الدورة</span><b>${I.period}</b></div>\n      <div><span>المجموعة</span><b>${grp}</b></div>\n      <div><span>الفئة</span><b class=\"ltr\">${I.block}</b></div>\n      <div><span>آخر مستوى فرعي</span><b class=\"ltr\">${I.last}</b></div>\n    </div>\n    <div class=\"valbox\">\n      <div class=\"vnum\">${I.val}</div>\n      <div><b>${I.block===\"f\"?\"إلكترونات المستوى الخارجي\":\"إلكترونات التكافؤ\"}</b>\n        <div class=\"vdots\">${\"<i></i>\".repeat(I.val)}</div>\n        <p class=\"note\">${note}</p></div>\n    </div>`;\n  $(\"cfgFull\").innerHTML=ssHTML(listOf(I.map,byShell),I.vk);\n  $(\"cfgNoble\").innerHTML=nobleHTML(Z,I.map,byShell,I.vk);\n  const ex=$(\"exc\");\n  if(I.exc){ex.innerHTML=`<b>حالة شاذة ⚡</b> ${excMsg(Z)}<div class=\"row-l\">المتوقع حسب مبدأ أوفباو</div><div class=\"cfg ltr\">${nobleHTML(Z,aufbauMap(Z).m,byShell)}</div><div class=\"row-l\">التوزيع الفعلي</div><div class=\"cfg ltr\">${nobleHTML(Z,I.map,byShell,I.vk)}</div>`;ex.classList.add(\"show\");}\n  else if(Z>=104){ex.innerHTML=\"<b>ملاحظة:</b> العناصر فائقة الثقل قصيرة العمر جداً، وتوزيعها الإلكتروني متوقَّع نظرياً.\";ex.classList.add(\"show\");}\n  else ex.classList.remove(\"show\");\n  const mode=orbMode||(Z>18?\"core\":\"full\");\n  document.querySelectorAll(\"#orbSeg button\").forEach(b=>b.classList.toggle(\"on\",b.dataset.v===mode));\n  $(\"orbs\").innerHTML=orbHTML(I.map,{core:mode===\"core\"?coreOf(Z):null,vk:I.vk});\n  $(\"bohr\").innerHTML=bohrSVG(I.map,I);$(\"shells\").innerHTML=shellsHTML(I.map,I);\n  $(\"auf\").innerHTML=aufbauSVG(I.map,null);\n  $(\"lewis\").innerHTML=lewisHTML(I);\n}\n\nfunction renderStep(map,newKey,k,isExc){\n  $(\"cfgFull\").innerHTML=ssHTML(listOf(map,false),null);\n  $(\"orbs\").innerHTML=orbHTML(map,{core:null,vk:null,newKey});\n  $(\"bohr\").innerHTML=bohrSVG(map,null);$(\"shells\").innerHTML=shellsHTML(map,null);\n  $(\"auf\").innerHTML=aufbauSVG(map,newKey);\n  $(\"counter\").textContent=isExc?\"⚡ إعادة ترتيب: \"+excMsg(Z):`الإلكترون ${k} من ${Z} يدخل المستوى ${newKey}`;\n}\nfunction play(){\n  if(timer){stop();render();return;}\n  const steps=[];for(let k=1;k<=Z;k++){const a=aufbauMap(k);steps.push({m:a.m,nk:a.last,k});}\n  if(EXC[Z])steps.push({m:actualMap(Z),nk:null,k:Z,exc:true});\n  const dt=Math.max(45,Math.min(450,4500/Z));let i=0;\n  $(\"play\").textContent=\"■ إيقاف\";$(\"orbs\").scrollIntoView({behavior:\"smooth\",block:\"center\"});\n  timer=setInterval(()=>{const s=steps[i++];renderStep(s.m,s.nk,s.k,s.exc);\n    if(i>=steps.length){clearInterval(timer);timer=null;setTimeout(()=>{if(!timer){const msg=$(\"counter\").textContent;render();$(\"play\").textContent=\"▶ شاهد الملء خطوة بخطوة\";$(\"counter\").textContent=EXC[Z]?msg:`اكتمل التوزيع: ${Z} إلكتروناً ✓`;}},s.exc?1600:dt+200);}\n  },dt);\n}\n\n$(\"play\").onclick=play;\n$(\"prev\").onclick=()=>select(Z-1);$(\"next\").onclick=()=>select(Z+1);\n$(\"slider\").oninput=e=>select(+e.target.value);\ndocument.querySelectorAll(\"#orderSeg button\").forEach(b=>b.onclick=()=>{orderMode=b.dataset.v;document.querySelectorAll(\"#orderSeg button\").forEach(x=>x.classList.toggle(\"on\",x===b));stop();render();});\ndocument.querySelectorAll(\"#orbSeg button\").forEach(b=>b.onclick=()=>{orbMode=b.dataset.v;stop();render();});\nconst norm=s=>s.trim().replace(/[أإآ]/g,\"ا\").replace(/ة/g,\"ه\").replace(/^ال/,\"\");\n$(\"search\").addEventListener(\"keydown\",e=>{if(e.key!==\"Enter\")return;const q=e.target.value.trim();if(!q)return;\n  let z=+q;if(!z){z=SYM.findIndex(s=>s.toLowerCase()===q.toLowerCase())+1;}\n  if(!z){const nq=norm(q);z=NAMES.findIndex(n=>norm(n)===nq)+1||NAMES.findIndex(n=>norm(n).startsWith(nq))+1;}\n  if(z>=1&&z<=118){select(z);e.target.value=\"\";}else{e.target.value=\"\";e.target.placeholder=\"لم يُعثر عليه، جرّب رمزاً مثل Na\";}});\ndocument.addEventListener(\"keydown\",e=>{if(e.target.tagName===\"INPUT\")return;if(e.key===\"ArrowRight\")select(Z+1);if(e.key===\"ArrowLeft\")select(Z-1);});\n\n// quiz\nlet score=0,total=0,streak=0,Q=null;\nconst rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nfunction newQ(){\n  const t=rint(0,2);let z,I,q,opts,ans,why;\n  if(t===0){do{z=rint(1,86);I=info(z);}while(I.block!==\"s\"&&I.block!==\"p\");\n    const s=new Set([I.val]);while(s.size<4)s.add(rint(1,8));opts=shuffle([...s]).map(v=>({h:String(v),ok:v===I.val}));\n    q=`كم عدد إلكترونات التكافؤ في ذرة ${I.name} (${I.sym})؟`;why=`<div class=\"cfg ltr\" style=\"font-size:1rem\">${nobleHTML(z,I.map,false,I.vk)}</div>المستوى الخارجي n = ${I.period} يحتوي ${I.val}.`;}\n  else if(t===1){do{z=rint(3,86);}while(EXC[z]);I=info(z);\n    const idx=KEYS.indexOf(I.last),s=new Set([I.last]);while(s.size<4)s.add(KEYS[Math.max(0,Math.min(15,idx+rint(-3,3)))]);\n    opts=shuffle([...s]).map(v=>({h:`<span class=\"ltr\">${v}</span>`,ok:v===I.last}));\n    q=`ما آخر مستوى فرعي يُملأ في ذرة ${I.name} (${I.sym})؟`;why=`<div class=\"cfg ltr\" style=\"font-size:1rem\">${ssHTML(listOf(I.map,false),[I.last])}</div>`;}\n  else{do{z=rint(5,54);}while(EXC[z]||EXC[z+1]||EXC[z-1]);I=info(z);\n    const cands=[z,z-1,z+1,z-2,z+2].filter(x=>x>=1&&x<=118&&!EXC[x]);const seen=new Set(),o=[];\n    for(const c of cands){const h=nobleHTML(c,actualMap(c),false);if(!seen.has(h)){seen.add(h);o.push({h:`<div class=\"cfg ltr\">${h}</div>`,ok:c===z});}if(o.length===4)break;}\n    opts=shuffle(o);q=`أي مما يلي هو ترميز الغاز النبيل لذرة ${I.name} (Z = ${z})؟`;why=`التوزيع الصحيح لعدد ${z} إلكتروناً.`;}\n  Q={z,why};$(\"qtext\").textContent=q;$(\"fb\").innerHTML=\"\";\n  $(\"opts\").innerHTML=opts.map((o,i)=>`<button class=\"opt\" data-ok=\"${o.ok}\">${o.h}</button>`).join(\"\");\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>answer(b));\n}\nfunction answer(b){\n  const ok=b.dataset.ok===\"true\";total++;\n  document.querySelectorAll(\".opt\").forEach(x=>{x.disabled=true;if(x.dataset.ok===\"true\")x.classList.add(\"right\");});\n  if(ok){score++;streak++;const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,streak%5===0?60:26);\n    $(\"fb\").innerHTML=`<b style=\"color:var(--good)\">${streak%5===0?\"سلسلة رائعة! \"+streak+\" إجابات متتالية 🏆\":\"إجابة صحيحة ✓\"}</b> ${Q.why}`;}\n  else{streak=0;b.classList.add(\"wrong\");$(\"fb\").innerHTML=`<b style=\"color:var(--bad)\">ليست صحيحة.</b> ${Q.why}`;}\n  $(\"sc\").textContent=score;$(\"tot\").textContent=total;$(\"stk\").textContent=streak;\n}\nfunction burst(x,y,n){\n  if(matchMedia(\"(prefers-reduced-motion: reduce)\").matches)return;\n  const box=$(\"confetti\"),cols=[\"var(--s)\",\"var(--p)\",\"var(--d)\",\"var(--f)\",\"var(--gold)\"];\n  for(let i=0;i<n;i++){const e=document.createElement(\"i\");e.style.left=x+\"px\";e.style.top=y+\"px\";e.style.background=cols[i%5];\n    e.style.setProperty(\"--dx\",(Math.random()*320-160)+\"px\");e.style.setProperty(\"--dy\",(Math.random()*260-200)+\"px\");box.appendChild(e);setTimeout(()=>e.remove(),1300);}\n}\n$(\"nextQ\").onclick=newQ;\n$(\"openQ\").onclick=()=>{if(Q){select(Q.z);window.scrollTo({top:0,behavior:\"smooth\"});}};\n\nrender();newQ();\n<\/script>\n</body>\n</html>\n"}}</script>

<script>
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const ORIGINAL_DATA_TEXT = document.getElementById('siteData').textContent;
const siteData = JSON.parse(ORIGINAL_DATA_TEXT);
const { teacher, highlights, galleryItems, contactChannels, sections } = siteData;
const labs = siteData.labs || {};

const ic = (name, extra) => `<i data-lucide="${name}" ${extra||''}></i>`;

function renderHome(){
  const statsHtml = highlights.map(h=>`
    <div class="stat-card">
      <div class="stat-icon">${ic(h.icon)}</div>
      <div class="stat-val">${h.value}</div>
      <div class="stat-lbl">${h.label}</div>
    </div>`).join('');

  const cardsHtml = sections.map(s=>`
    <a class="sec-card" href="#d-${s.id}">
      <div class="sec-top">
        <span class="sec-icon">${ic(s.icon)}</span>
        <span class="sec-num">${s.n}</span>
      </div>
      <h3>${s.title}</h3>
      <p>${s.text}</p>
      <span class="sec-more">عرض التفاصيل ${ic('arrow-left')}</span>
    </a>`).join('');

  const galleryHtml = galleryItems.map(g=>{
    const count = g.evidence ? g.evidence.length : 0;
    const hint = g.link
      ? `<span class="g-open">${ic('play')} افتح المختبر التفاعلي</span>`
      : g.id
        ? `<span class="g-open">${ic('images')} ${count ? `عرض الصور (${count})` : 'إضافة صور'}</span>`
        : '';
    const inner = `
      <div class="g-thumb">${ic(g.icon)}</div>
      <div class="g-body"><h3>${g.title}</h3><p>${g.caption}</p>${hint}</div>`;
    if(g.link) return `<a class="g-card g-clickable" href="#lab-${g.link}">${inner}</a>`;
    if(g.id) return `<a class="g-card g-clickable" href="#gp-${g.id}">${inner}</a>`;
    return `<div class="g-card">${inner}</div>`;
  }).join('');

  const contactHtml = contactChannels.map(c=>`
    <div class="c-card">
      <div class="c-icon">${ic(c.icon)}</div>
      <h3>${c.label}</h3>
      <div class="val">${c.value}</div>
      <div class="hint">${c.hint}</div>
    </div>`).join('');

  return `
  <section id="top">
    <span class="side-deco right">${ic('microscope')}</span>
    <span class="side-deco left">${ic('flask-conical')}${ic('atom')}</span>
    <div class="hero-inner">
      <h1 class="hero-title font-display">ملف الأداء الوظيفي</h1>
      <p class="hero-name-pill">${teacher.name}</p>
      <p class="hero-lede">شواهد وممارسات مهنية توثق رحلة العطاء في تدريس الكيمياء، من التخطيط والتجربة المختبرية إلى التقويم وتحسين نتائج المتعلمين.</p>
      <div class="hero-ctas">
        <a class="btn solid" href="#sections" onclick="return goHome('sections')">تصفّح الأقسام ${ic('arrow-left')}</a>
        <a class="btn ghost" href="#contact" onclick="return goHome('contact')">تواصل معي</a>
      </div>
    </div>
  </section>

  <section class="stats"><div class="stats-grid">${statsHtml}</div></section>

  <section id="intro" class="lab-pattern">
    <div class="in">
      <h2 class="font-display">المقدمة</h2>
      <p class="ayah">﴿ وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ ﴾</p>
      <p class="body">الكيمياء علمٌ يُقرّب الطالب من فهم العالم من حوله، ومهمتي أن أجعل كل تفاعل وكل معادلة بابًا للفضول والاكتشاف. هذا الملف يوثّق ما تحقق داخل الفصل والمختبر من ممارسات وشواهد وأثر ملموس في تعلّم الطلاب.</p>
    </div>
  </section>

  <section id="sections">
    <div class="sec-inner">
      <div class="sec-head">
        <h2 class="font-display">أقسام الملف</h2>
        <p>اضغط على أي قسم لعرض تفرعاته وشواهده بالتفصيل</p>
      </div>
      <div class="cards-grid">${cardsHtml}</div>
    </div>
  </section>

  <section id="gallery" class="lab-pattern">
    <div class="sec-inner">
      <div class="sec-head">
        <h2 class="font-display">معرض التجارب</h2>
        <p>لمحات من الأنشطة العملية داخل مختبر الكيمياء</p>
      </div>
      <div class="gallery-grid">${galleryHtml}</div>
    </div>
  </section>

  <section id="contact">
    <div class="contact-inner">
      <div class="contact-badge">${ic('graduation-cap')}</div>
      <h2 class="font-display">للتواصل</h2>
      <p>سعيد باستقبال ملاحظاتكم واستفساراتكم حول الملف أو مادة الكيمياء</p>
      <div class="contact-grid">${contactHtml}</div>
      <div class="thanks">${ic('star')} <span>شكرًا لزيارتكم ملف الأداء الوظيفي</span> ${ic('award')}</div>
    </div>
  </section>

  <footer class="site-foot">
    <p class="font-display">ملف الأداء الوظيفي — ${teacher.name}</p>
    <p>${teacher.role}</p>
  </footer>
  `;
}

function renderDetail(s){
  const subsHtml = s.flat
    ? s.subs.map(sub=>`
      <div class="sub-flat">
        <h3>${sub.title}</h3>
        <p>${sub.text}</p>
        <div class="examples">${sub.ex.map(e=>`<span class="ex-chip">${e}</span>`).join('')}</div>
      </div>`).join('')
    : s.subs.map((sub,i)=>`
      <a class="sub-card" href="#b-${s.id}-${i}">
        <span class="sub-n">${String(i+1).padStart(2,'0')}</span>
        <span class="sub-body">
          <h3>${sub.title}</h3>
          <p>${sub.text}</p>
        </span>
        <span class="sub-arrow">${ic('arrow-left')}</span>
      </a>`).join('');

  const idx = sections.findIndex(x=>x.id===s.id);
  const prev = idx>0 ? sections[idx-1] : null;
  const next = idx<sections.length-1 ? sections[idx+1] : null;

  return `
  <div class="detail-inner">
    <a class="back-link" href="#top" onclick="return goHome('sections')">${ic('arrow-left', 'style="transform:scaleX(-1)"')} الرئيسية / الأقسام</a>
    <div class="d-head">
      <span class="d-icon">${ic(s.icon)}</span>
      <div>
        <div class="d-n">${s.n} / ١٠</div>
        <h2 class="font-display">${s.title}</h2>
        <p>${s.text}</p>
      </div>
    </div>
    <div class="${s.flat?'sub-flat-list':'sub-list'}">${subsHtml}</div>
    <div class="page-nav">
      <span>${prev?`<a href="#d-${prev.id}">◂ ${prev.title}</a>`:''}</span>
      <span>${next?`<a href="#d-${next.id}">${next.title} ▸</a>`:''}</span>
    </div>
  </div>`;
}

function renderSub(s, i){
  const sub = s.subs[i];
  const prevSub = i>0 ? s.subs[i-1] : null;
  const nextSub = i<s.subs.length-1 ? s.subs[i+1] : null;
  const exHtml = sub.ex.map(e=>`<span class="ex-chip">${e}</span>`).join('');
  const list = sub.evidence || [];

  const filled = list.map((ev,k)=>{
    const inner = ev.type==='image'
      ? `<a class="evidence-slot filled" href="${ev.src}" target="_blank" rel="noopener">
          <img src="${ev.src}" alt="${ev.label}">
          <div class="lbl">${ic('image')} ${ev.label}</div>
        </a>`
      : `<a class="evidence-slot filled file" href="${ev.src}" download="${ev.filename||'شاهد.pdf'}">
          ${ic('file-text')}
          <div class="lbl">${ev.label}</div>
          <div class="dl">${ic('download')} تحميل الملف</div>
        </a>`;
    const removeBtn = editMode ? `<button class="ev-remove" data-sid="${s.id}" data-si="${i}" data-idx="${k}" type="button">${ic('x')}</button>` : '';
    return `<div class="evidence-wrap">${inner}${removeBtn}</div>`;
  });

  const emptyCount = Math.max(0, 3 - filled.length);
  const empties = Array.from({length: emptyCount}).map((_,n)=>{
    if(editMode){
      return `<label class="evidence-slot upload" data-sid="${s.id}" data-si="${i}">
        <input type="file" accept="image/*,application/pdf" data-upload style="display:none">
        ${ic('upload')}
        <div class="lbl">إضافة شاهد ${filled.length+n+1}</div>
      </label>`;
    }
    return `<div class="evidence-slot">
      ${ic('image-plus')}
      <div class="lbl">شاهد ${filled.length+n+1}</div>
    </div>`;
  });
  const slots = [...filled, ...empties].join('');

  return `
  <div class="detail-inner">
    <div class="crumbs">
      <a href="#top" onclick="return goHome('sections')">الرئيسية</a>
      <span>/</span>
      <a href="#d-${s.id}">${s.title}</a>
      <span>/</span>
      <span>${sub.title}</span>
    </div>
    <div class="d-head">
      <span class="d-icon">${ic(s.icon)}</span>
      <div>
        <div class="d-n">${s.n} · فرع ${i+1} من ${s.subs.length}</div>
        <h2 class="font-display">${sub.title}</h2>
        <p>${sub.text}</p>
      </div>
    </div>
    <div class="examples" style="margin-bottom:34px;">${exHtml}</div>

    <div class="evidence-block">
      <h3 class="font-display evidence-title">${ic('paperclip')} الشواهد</h3>
      <p class="evidence-hint">أضف هنا الشواهد الخاصة بهذا المؤشر لاحقًا (صور، مستندات، أو روابط).</p>
      <div class="evidence-slots">${slots}</div>
    </div>

    <div class="page-nav">
      <span>${prevSub?`<a href="#b-${s.id}-${i-1}">◂ ${prevSub.title}</a>`:`<a href="#d-${s.id}">◂ رجوع للقسم</a>`}</span>
      <span>${nextSub?`<a href="#b-${s.id}-${i+1}">${nextSub.title} ▸</a>`:`<a href="#d-${s.id}">رجوع للقسم ▸</a>`}</span>
    </div>
  </div>`;
}

function renderGalleryPhotos(item){
  const list = item.evidence || [];
  const photosHtml = list.map((ev,k)=>`
    <div class="evidence-wrap gp-item">
      <a class="evidence-slot filled" href="${ev.src}" target="_blank" rel="noopener">
        <img src="${ev.src}" alt="${ev.label||item.title}">
      </a>
      ${editMode?`<button class="ev-remove" data-gid="${item.id}" data-idx="${k}" type="button">${ic('x')}</button>`:''}
    </div>`).join('');

  const addTile = editMode ? `
    <label class="evidence-slot upload gp-item" data-gid="${item.id}">
      <input type="file" accept="image/*" data-gupload style="display:none">
      ${ic('upload')}
      <div class="lbl">إضافة صورة</div>
    </label>` : '';

  const emptyState = (!editMode && list.length===0)
    ? `<p class="gp-empty">ما فيه صور مضافة بعد.</p>` : '';

  return `
  <div class="detail-inner">
    <div class="crumbs">
      <a href="#top" onclick="return goHome('gallery')">الرئيسية</a>
      <span>/</span>
      <span>معرض التجارب</span>
      <span>/</span>
      <span>${item.title}</span>
    </div>
    <div class="d-head">
      <span class="d-icon">${ic(item.icon)}</span>
      <div>
        <h2 class="font-display">${item.title}</h2>
        <p>${item.caption}</p>
      </div>
    </div>
    ${emptyState}
    <div class="gp-grid">${photosHtml}${addTile}</div>
  </div>`;
}

function renderLab(key){
  const titles = { molecular: "نماذج جزيئية — مختبر تفاعلي", lesson: "التوزيع الإلكتروني — مختبر تفاعلي" };
  return `
  <div class="lab-bar">
    <a href="#top" onclick="return goHome('gallery')">${ic('arrow-left', 'style="transform:scaleX(-1)"')} الرئيسية / معرض التجارب</a>
    <span>${titles[key] || 'مختبر تفاعلي'}</span>
  </div>
  <div class="lab-wrap">
    <div class="lab-frame-box">
      <iframe class="lab-frame" id="labFrame" title="${titles[key] || 'مختبر تفاعلي'}"></iframe>
    </div>
  </div>`;
}

function route(){
  const hash = location.hash || "#top";
  const content = document.getElementById('content');
  if(hash.startsWith("#lab-")){
    const key = hash.slice(5);
    content.innerHTML = renderLab(key);
    const frame = document.getElementById('labFrame');
    if(frame && labs[key]) frame.srcdoc = labs[key];
  } else if(hash.startsWith("#gp-")){
    const item = galleryItems.find(g=>g.id===hash.slice(4));
    content.innerHTML = item ? renderGalleryPhotos(item) : renderHome();
  } else if(hash.startsWith("#b-")){
    const rest = hash.slice(3);
    const li = rest.lastIndexOf('-');
    const s = sections.find(x=>x.id===rest.slice(0,li));
    const i = parseInt(rest.slice(li+1),10);
    content.innerHTML = (s && s.subs[i]) ? renderSub(s,i) : renderHome();
  } else if(hash.startsWith("#d-")){
    const s = sections.find(x=>x.id===hash.slice(3));
    content.innerHTML = s ? renderDetail(s) : renderHome();
  } else {
    content.innerHTML = renderHome();
    if(["#intro","#sections","#gallery","#contact"].includes(hash)){
      setTimeout(()=>document.getElementById(hash.slice(1))?.scrollIntoView({behavior:"smooth"}), 30);
    }
  }
  if(window.lucide) lucide.createIcons();
  const mn = document.getElementById('mobileNav');
  if(mn && !hash.startsWith("#d-") && !hash.startsWith("#b-") && !hash.startsWith("#lab-") && !hash.startsWith("#gp-")){ mn.value = hash==="#top"||hash===""?"top":hash.slice(1); }
}

function goHome(scrollId){
  const h = location.hash;
  const notHome = h.startsWith("#d-") || h.startsWith("#b-") || h.startsWith("#lab-") || h.startsWith("#gp-");
  if(notHome){
    location.hash = "#top";
    if(scrollId){ setTimeout(()=>document.getElementById(scrollId)?.scrollIntoView({behavior:"smooth"}), 70); }
  } else if(scrollId){
    document.getElementById(scrollId)?.scrollIntoView({behavior:"smooth"});
  } else {
    window.scrollTo({top:0,behavior:"smooth"});
  }
  return false;
}

const EDIT_PIN = "2580";
let editMode = false;
try{ editMode = sessionStorage.getItem('editMode') === '1'; }catch(e){}

  const btn = document.getElementById('lockBtn');
  const banner = document.getElementById('editBanner');

function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.75;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

async function handleFileUpload(input, sid, si){
  const file = input.files && input.files[0];
  if(!file) return;
  const s = sections.find(x=>x.id===sid);
  if(!s) return;
  const sub = s.subs[si];
  sub.evidence = sub.evidence || [];
  let item = null;
  if(file.type === 'application/pdf'){
    const src = await readAsDataURL(file);
    item = { type:'pdf', label: (file.name||'ملف').replace(/\.pdf$/i,''), filename: file.name || 'شاهد.pdf', src };
  } else if(file.type.indexOf('image/')===0){
    const src = await resizeImageFile(file);
    if(src) item = { type:'image', label:'صورة شاهد', src };
  } else {
    alert('الرجاء اختيار صورة أو ملف PDF.');
    return;
  }
  if(item){ sub.evidence.push(item); route(); }
}

function removeEvidence(sid, si, idx){
  const s = sections.find(x=>x.id===sid);
  if(!s) return;
  const sub = s.subs[si];
  if(sub.evidence) sub.evidence.splice(idx,1);
  route();
}

async function handleGalleryUpload(input, gid){
  const file = input.files && input.files[0];
  if(!file) return;
  const item = galleryItems.find(g=>g.id===gid);
  if(!item) return;
  if(file.type.indexOf('image/')!==0){
    alert('الرجاء اختيار صورة.');
    return;
  }
  const src = await resizeImageFile(file);
  if(!src) return;
  item.evidence = item.evidence || [];
  item.evidence.push({ type:'image', label: item.title, src });
  route();
}

function removeGalleryEvidence(gid, idx){
  const item = galleryItems.find(g=>g.id===gid);
  if(!item || !item.evidence) return;
  item.evidence.splice(idx,1);
  route();
}

document.getElementById('content').addEventListener('change', (e)=>{
  const gInput = e.target.closest('[data-gupload]');
  if(gInput){
    const holder = gInput.closest('[data-gid]');
    if(holder) handleGalleryUpload(gInput, holder.dataset.gid);
    return;
  }
  const input = e.target.closest('[data-upload]');
  if(!input) return;
  const holder = input.closest('[data-sid]');
  if(holder) handleFileUpload(input, holder.dataset.sid, parseInt(holder.dataset.si,10));
});
document.getElementById('content').addEventListener('click', (e)=>{
  const btn = e.target.closest('.ev-remove');
  if(!btn) return;
  e.preventDefault();
  if(btn.dataset.gid){ removeGalleryEvidence(btn.dataset.gid, parseInt(btn.dataset.idx,10)); return; }
  removeEvidence(btn.dataset.sid, parseInt(btn.dataset.si,10), parseInt(btn.dataset.idx,10));
});

document.getElementById('lockBtn').addEventListener('click', ()=>{
  if(editMode){
    editMode = false;
    try{ sessionStorage.removeItem('editMode'); }catch(e){}
    updateLockUI(); route();
  } else {
    document.getElementById('pinOverlay').classList.add('show');
    document.getElementById('pinError').classList.remove('show');
    const pi = document.getElementById('pinInput');
    pi.value = '';
    setTimeout(()=>pi.focus(), 50);
  }
});
document.getElementById('pinCancel').addEventListener('click', ()=>{
  document.getElementById('pinOverlay').classList.remove('show');
});
function submitPin(){
  const val = document.getElementById('pinInput').value;
  if(val === EDIT_PIN){
    editMode = true;
    try{ sessionStorage.setItem('editMode','1'); }catch(e){}
    document.getElementById('pinOverlay').classList.remove('show');
    updateLockUI(); route();
  } else {
    document.getElementById('pinError').classList.add('show');
  }
}
document.getElementById('pinSubmit').addEventListener('click', submitPin);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitPin(); });
document.getElementById('lockOutBtn').addEventListener('click', ()=>{
  editMode = false;
  try{ sessionStorage.removeItem('editMode'); }catch(e){}
  updateLockUI(); route();
});
document.getElementById('exportBtn').addEventListener('click', exportSite);
async function exportSite(){
  const newDataText = JSON.stringify(siteData).replace(/<\/script/gi, '<\\/script');
  const newHtml = ORIGINAL_HTML.replace(ORIGINAL_DATA_TEXT, newDataText);
  const filename = 'performance-portfolio.html';

  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename, data: newHtml });
        return;
      }
    } catch(err) {
      if (err && err.code === 'declined') return;
      console.warn('downloads capability failed, falling back:', err);
    }
  }

  const blob = new Blob([newHtml], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

window.addEventListener('hashchange', route);
updateLockUI();
route();

document.getElementById('mobileNav').addEventListener('change', (e)=>{
  const v = e.target.value;
  if(v === 'top'){ goHome(null); } else { goHome(v); }
});
