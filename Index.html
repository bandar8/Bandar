<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف الأداء الوظيفي | أ / بندر عويض العصيمي — مادة الكيمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.js"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --radius:0.75rem;
    --background: oklch(0.99 0.005 95);
    --foreground: oklch(0.28 0.03 150);
    --card: oklch(1 0 0);
    --primary: oklch(0.62 0.17 148);
    --primary-foreground: oklch(0.99 0.005 95);
    --secondary: oklch(0.94 0.04 150);
    --muted-foreground: oklch(0.5 0.03 150);
    --accent: oklch(0.76 0.17 45);
    --accent-foreground: oklch(0.3 0.09 45);
    --border: oklch(0.91 0.02 150);
    --lab: oklch(0.55 0.15 165);
    --reaction: oklch(0.78 0.18 45);
    --molecule: oklch(0.88 0.05 150);
  }
  html{scroll-padding-top:80px;}
  *{box-sizing:border-box;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --background: oklch(0.16 0.025 150);
      --foreground: oklch(0.95 0.01 95);
      --card: oklch(0.21 0.035 150);
      --primary: oklch(0.72 0.14 150);
      --primary-foreground: oklch(0.14 0.03 150);
      --secondary: oklch(0.27 0.045 150);
      --muted-foreground: oklch(0.72 0.02 145);
      --accent: oklch(0.74 0.15 45);
      --accent-foreground: oklch(0.15 0.05 45);
      --border: oklch(1 0 0 / 12%);
      --lab: oklch(0.65 0.12 165);
      --reaction: oklch(0.76 0.15 45);
      --molecule: oklch(0.4 0.06 150);
    }
  }
  :root[data-theme="dark"]{
    --background: oklch(0.16 0.025 150);
    --foreground: oklch(0.95 0.01 95);
    --card: oklch(0.21 0.035 150);
    --primary: oklch(0.72 0.14 150);
    --primary-foreground: oklch(0.14 0.03 150);
    --secondary: oklch(0.27 0.045 150);
    --muted-foreground: oklch(0.72 0.02 145);
    --accent: oklch(0.74 0.15 45);
    --accent-foreground: oklch(0.15 0.05 45);
    --border: oklch(1 0 0 / 12%);
    --lab: oklch(0.65 0.12 165);
    --reaction: oklch(0.76 0.15 45);
    --molecule: oklch(0.4 0.06 150);
  }

  html,body{height:100%;margin:0;background:var(--background);color:var(--foreground);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;}
  .font-display{font-family:'Amiri','IBM Plex Sans Arabic',serif;font-weight:700;letter-spacing:0;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}
  @media (max-width:640px){ .wrap{padding:0 18px;} }
  svg.lucide{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;vertical-align:-0.15em;}

  /* header */
  header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--card) 95%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);}
  .site-inner{display:flex;align-items:center;gap:18px;padding:11px 24px;max-width:1000px;margin:0 auto;}
  .brand-link{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .brand-icon{display:flex;height:36px;width:36px;align-items:center;justify-content:center;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:18px;}
  .brand-name{font-family:'Amiri',serif;font-size:15px;}
  nav.top-nav{display:none;align-items:center;gap:2px;flex:1;overflow-x:auto;margin-inline-end:auto;}
  nav.top-nav a, nav.top-nav button{background:none;border:none;font-family:inherit;cursor:pointer;font-size:13px;color:var(--muted-foreground);padding:7px 13px;border-radius:999px;white-space:nowrap;}
  nav.top-nav a:hover, nav.top-nav button:hover{background:var(--accent);color:var(--accent-foreground);}
  select.mobile-nav{margin-inline-start:auto;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground);padding:8px 14px;font-size:13px;font-family:inherit;max-width:56vw;}
  @media (min-width:920px){
    nav.top-nav{display:flex;}
    select.mobile-nav{display:none;}
  }

  /* hero */
  section#top{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 40%, var(--background));}
  .side-deco{position:absolute;inset-block:0;display:none;align-items:center;pointer-events:none;opacity:.25;color:var(--foreground);}
  .side-deco.right{right:0;width:160px;justify-content:center;}
  .side-deco.left{left:0;width:160px;flex-direction:column;justify-content:center;gap:24px;}
  .side-deco svg{stroke-width:.75;}
  .side-deco.right svg{width:140px;height:140px;}
  .side-deco.left svg:first-child{width:64px;height:64px;}
  .side-deco.left svg:last-child{width:80px;height:80px;}
  @media (min-width:820px){ .side-deco{display:flex;} }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  .hero-inner{max-width:760px;margin:0 auto;padding:78px 24px;text-align:center;position:relative;z-index:1;}
  h1.hero-title{margin:0;font-size:clamp(34px,6.4vw,58px);line-height:1.25;}
  .hero-name-pill{display:inline-block;margin-top:22px;border-radius:20px;background:var(--primary);color:var(--primary-foreground);padding:12px 32px;font-size:clamp(19px,2.6vw,25px);font-family:'Amiri',serif;font-weight:700;box-shadow:0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent);}
  .hero-lede{max-width:560px;margin:22px auto 0;font-size:15.5px;line-height:1.85;color:var(--muted-foreground);}
  .hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 26px;font-size:14.5px;font-weight:600;}
  .btn.solid{background:var(--primary);color:var(--primary-foreground);box-shadow:0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent);}
  .btn.solid:hover{transform:translateY(-1px);}
  .btn.ghost{border:1px solid var(--border);background:var(--card);}
  .btn.ghost:hover{background:var(--secondary);}

  /* stats */
  section.stats{border-bottom:1px solid var(--border);background:var(--card);}
  .stats-grid{max-width:1000px;margin:0 auto;padding:38px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:640px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-card{border:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 45%, transparent);border-radius:22px;padding:22px 14px;text-align:center;}
  .stat-icon{display:flex;height:46px;width:46px;margin:0 auto;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);font-size:21px;}
  .stat-val{margin-top:14px;font-family:'Amiri',serif;font-size:27px;color:var(--primary);}
  .stat-lbl{margin-top:3px;font-size:12.5px;color:var(--muted-foreground);}

  /* lab pattern bg sections */
  .lab-pattern{background-image:
      radial-gradient(circle at 10% 20%, color-mix(in oklab, var(--lab) 14%, transparent) 0%, transparent 28%),
      radial-gradient(circle at 90% 80%, color-mix(in oklab, var(--reaction) 11%, transparent) 0%, transparent 30%),
      radial-gradient(circle at 50% 55%, color-mix(in oklab, var(--molecule) 10%, transparent) 0%, transparent 45%);}

  /* intro */
  section#intro .in{max-width:660px;margin:0 auto;padding:76px 24px;text-align:center;}
  section#intro h2{font-size:24px;margin:0;}
  .ayah{margin:26px 0 0;font-family:'Amiri';font-size:32px;line-height:2;color:var(--primary);}
  section#intro p.body{margin:26px 0 0;font-size:15.5px;line-height:1.9;color:var(--muted-foreground);}

  /* sections index */
  section#sections{border-block:1px solid var(--border);background:var(--card);}
  .sec-inner{max-width:1000px;margin:0 auto;padding:76px 24px;}
  .sec-head{text-align:center;}
  .sec-head h2{font-size:26px;margin:0 0 10px;}
  .sec-head p{font-size:14px;color:var(--muted-foreground);margin:0;}
  .cards-grid{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:880px){ .cards-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .cards-grid{grid-template-columns:1fr;} }
  .sec-card{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--background);border-radius:22px;padding:26px;transition:transform .18s ease, border-color .18s ease;}
  .sec-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--primary) 40%, var(--border));}
  .sec-card:hover .sec-icon{background:var(--primary);color:var(--primary-foreground);}
  .sec-top{display:flex;align-items:center;justify-content:space-between;}
  .sec-icon{display:flex;height:52px;width:52px;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);font-size:24px;transition:background .18s ease, color .18s ease;}
  .sec-num{font-family:'Amiri',serif;font-size:26px;color:color-mix(in srgb, var(--foreground) 22%, transparent);}
  .sec-card h3{margin:18px 0 0;font-size:18px;font-family:'Amiri',serif;font-weight:700;}
  .sec-card p{margin:10px 0 0;font-size:13px;line-height:1.65;color:var(--muted-foreground);}
  .sec-more{margin-top:16px;font-size:13px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:5px;}

  /* gallery */
  section#gallery .sec-inner{}
  .gallery-grid{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:880px){ .gallery-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .gallery-grid{grid-template-columns:1fr;} }
  .g-card{overflow:hidden;border:1px solid var(--border);background:var(--card);border-radius:22px;display:block;}
  .g-clickable{transition:transform .18s ease, border-color .18s ease;cursor:pointer;}
  .g-clickable:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--primary) 40%, var(--border));}
  .g-open{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--primary);}
  .g-thumb{display:flex;height:130px;align-items:center;justify-content:center;background:color-mix(in srgb, var(--secondary) 55%, transparent);color:var(--primary);font-size:44px;}
  .g-body{padding:20px;}
  .g-body h3{margin:0;font-size:15px;font-family:'Amiri',serif;}
  .g-body p{margin:8px 0 0;font-size:12.5px;color:var(--muted-foreground);line-height:1.6;}
  .gallery-note{text-align:center;font-size:12.5px;color:var(--muted-foreground);margin-top:26px;}

  /* contact */
  section#contact{border-top:1px solid var(--border);background:var(--card);}
  .contact-inner{max-width:760px;margin:0 auto;padding:76px 24px;text-align:center;}
  .contact-badge{display:flex;height:52px;width:52px;margin:0 auto;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);font-size:23px;}
  .contact-inner h2{margin:18px 0 0;font-size:25px;}
  .contact-inner > p{margin:10px 0 0;color:var(--muted-foreground);font-size:14px;}
  .contact-grid{margin-top:38px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:520px){ .contact-grid{grid-template-columns:1fr;} }
  .c-card{border:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 45%, transparent);border-radius:22px;padding:26px;}
  .c-icon{display:flex;height:44px;width:44px;margin:0 auto;align-items:center;justify-content:center;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:18px;}
  .c-card h3{margin:14px 0 0;font-size:15.5px;font-family:'Amiri',serif;}
  .c-card .val{margin:8px 0 0;color:var(--muted-foreground);direction:ltr;font-size:14px;}
  .c-card .hint{margin:4px 0 0;font-size:11.5px;color:var(--muted-foreground);}
  .thanks{margin-top:36px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13.5px;color:var(--muted-foreground);}
  .thanks svg{color:var(--accent);}

  footer.site-foot{border-top:1px solid var(--border);background:color-mix(in srgb, var(--secondary) 45%, transparent);padding:32px 0 calc(32px + env(safe-area-inset-bottom,0px));text-align:center;}
  footer.site-foot p:first-child{font-family:'Amiri',serif;font-size:17px;margin:0;}
  footer.site-foot p:last-child{margin:8px 0 0;font-size:13px;color:var(--muted-foreground);}

  /* detail page */
  .detail-inner{max-width:760px;margin:0 auto;padding:64px 24px 90px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--primary);margin-bottom:30px;}
  .d-head{display:flex;align-items:flex-start;gap:18px;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:36px;}
  .d-icon{display:flex;height:60px;width:60px;flex-shrink:0;align-items:center;justify-content:center;border-radius:18px;background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);font-size:27px;}
  .d-head .d-n{font-family:'Amiri',serif;font-size:13px;color:var(--accent);margin-bottom:6px;}
  .d-head h2{margin:0 0 10px;font-size:clamp(23px,3.6vw,32px);}
  .d-head p{margin:0;font-size:14.5px;color:var(--muted-foreground);line-height:1.7;}
  .sub-flat-list{display:flex;flex-direction:column;}
  .sub-flat{padding:26px 0;border-bottom:1px solid var(--border);}
  .sub-flat-list .sub-flat:first-child{padding-top:0;}
  .sub-flat-list .sub-flat:last-child{border-bottom:none;}
  .sub-flat h3{margin:0 0 8px;font-size:16.5px;font-family:'Amiri',serif;}
  .sub-flat p{margin:0 0 12px;font-size:14px;color:var(--muted-foreground);line-height:1.75;}
  .sub-list{display:flex;flex-direction:column;}
  .sub-card{display:flex;align-items:center;gap:16px;padding:20px 4px;border-bottom:1px solid var(--border);transition:background .15s ease;border-radius:12px;}
  .sub-list .sub-card:first-child{padding-top:4px;}
  .sub-list .sub-card:last-child{border-bottom:none;}
  .sub-card:hover{background:var(--secondary);}
  .sub-card .sub-n{font-family:'Amiri',serif;font-size:19px;color:var(--primary);min-width:28px;flex-shrink:0;}
  .sub-card .sub-body{flex:1;min-width:0;}
  .sub-card .sub-body h3{margin:0 0 5px;font-size:15.5px;font-family:'Amiri',serif;}
  .sub-card .sub-body p{margin:0;font-size:13px;color:var(--muted-foreground);line-height:1.6;}
  .sub-card .sub-arrow{color:var(--primary);flex-shrink:0;font-size:15px;}
  .examples{display:flex;flex-wrap:wrap;gap:8px;}
  .ex-chip{font-size:12px;color:var(--primary);background:color-mix(in srgb, var(--primary) 8%, transparent);border:1px solid color-mix(in srgb, var(--primary) 22%, transparent);border-radius:999px;padding:5px 12px;}
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-foreground);margin-bottom:26px;}
  .crumbs a{color:var(--primary);}
  .crumbs span{color:var(--border);}
  .evidence-block{margin-top:8px;padding-top:30px;border-top:1px solid var(--border);}
  .evidence-title{display:flex;align-items:center;gap:9px;font-size:18px;margin:0;}
  .evidence-hint{margin:10px 0 0;font-size:13.5px;color:var(--muted-foreground);line-height:1.7;}
  .evidence-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;}
  @media (max-width:560px){ .evidence-slots{grid-template-columns:1fr;} }
  .evidence-slot{border:2px dashed var(--border);border-radius:18px;padding:32px 12px;text-align:center;color:var(--muted-foreground);}
  .evidence-slot i{font-size:24px;color:var(--primary);margin-bottom:10px;display:inline-block;}
  .evidence-slot .lbl{font-size:12.5px;}
  .evidence-slot.filled{display:block;border-style:solid;padding:0;overflow:hidden;background:var(--card);text-decoration:none;color:var(--foreground);transition:transform .15s ease, box-shadow .15s ease;}
  .evidence-slot.filled:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px color-mix(in srgb, var(--foreground) 25%, transparent);}
  .evidence-slot.filled img{width:100%;height:130px;object-fit:cover;display:block;}
  .evidence-slot.filled .lbl{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;padding:12px 10px 4px;color:var(--foreground);}
  .evidence-slot.filled .lbl i{font-size:13px;margin:0;color:var(--primary);}
  .evidence-slot.filled.file{padding:26px 14px;}
  .evidence-slot.filled.file i{color:var(--primary);}
  .evidence-slot.filled .dl{font-size:11px;color:var(--primary);display:flex;align-items:center;gap:5px;justify-content:center;padding-bottom:12px;}
  .evidence-slot.filled .dl i{font-size:12px;margin:0;}
  .page-nav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:44px;font-size:13px;}
  .page-nav a{color:var(--primary);font-weight:600;}

  /* interactive lab page */
  .lab-bar{position:sticky;top:57px;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);}
  .lab-bar a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--primary);font-weight:600;}
  .lab-bar span{font-size:13px;color:var(--muted-foreground);}
  .lab-wrap{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .lab-frame-box{max-width:640px;margin:0 auto;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 14px 30px -18px rgba(0,0,0,.25);}
  iframe.lab-frame{display:block;width:100%;height:calc(100dvh - 210px);min-height:520px;border:0;}

  /* edit mode: lock button, pin modal, banner, upload affordances */
  .lock-btn{margin-inline-start:10px;flex-shrink:0;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .lock-btn.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  @media (min-width:920px){ .lock-btn{margin-inline-start:0;} }

  .pin-overlay{display:none;position:fixed;inset:0;z-index:200;background:color-mix(in srgb, black 45%, transparent);align-items:center;justify-content:center;padding:20px;}
  .pin-overlay.show{display:flex;}
  .pin-box{background:var(--card);border-radius:22px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px -12px rgba(0,0,0,.35);}
  .pin-box h3{margin:0 0 8px;font-size:18px;}
  .pin-box p{margin:0 0 18px;font-size:13px;color:var(--muted-foreground);}
  .pin-box input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;text-align:center;letter-spacing:4px;background:var(--background);color:var(--foreground);margin-bottom:16px;}
  .pin-actions{display:flex;gap:10px;}
  .pin-actions .btn{flex:1;padding:10px 14px;font-size:13.5px;}
  .pin-error{display:none;color:#c0392b;font-size:12.5px;margin:10px 0 0;}
  .pin-error.show{display:block;}

  .edit-banner{display:none;position:sticky;top:57px;z-index:45;background:var(--primary);color:var(--primary-foreground);align-items:center;gap:10px;padding:10px 20px;font-size:12.5px;flex-wrap:wrap;justify-content:center;text-align:center;}
  .edit-banner.show{display:flex;}
  .edit-banner button{background:color-mix(in srgb, white 20%, transparent);color:inherit;border:none;border-radius:999px;padding:7px 14px;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;}
  .edit-banner button.lock-out{background:transparent;text-decoration:underline;padding:7px 8px;}

  .evidence-slot.upload{cursor:pointer;transition:border-color .15s ease, background .15s ease;}
  .evidence-slot.upload:hover{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 6%, transparent);}
  .evidence-wrap{position:relative;}
  .ev-remove{position:absolute;top:8px;left:8px;z-index:2;width:26px;height:26px;border-radius:999px;border:none;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}

  .gp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:640px){ .gp-grid{grid-template-columns:repeat(2,1fr);} }
  .gp-item{aspect-ratio:1/1;}
  .gp-item .evidence-slot.filled{height:100%;}
  .gp-item .evidence-slot.filled img{width:100%;height:100%;object-fit:cover;}
  .gp-item .evidence-slot.upload{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gp-empty{font-size:13.5px;color:var(--muted-foreground);margin:0 0 20px;}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a class="brand-link" href="#top" onclick="return goHome(null)">
      <span class="brand-icon"><i data-lucide="flask-conical"></i></span>
      <span class="brand-name font-display">ملف مادة الكيمياء</span>
    </a>
    <nav class="top-nav" id="topNav">
      <a href="#top" onclick="return goHome(null)">الرئيسية</a>
      <button onclick="goHome('intro')">المقدمة</button>
      <button onclick="goHome('sections')">الأقسام</button>
      <button onclick="goHome('gallery')">معرض التجارب</button>
      <button onclick="goHome('contact')">التواصل</button>
    </nav>
    <select class="mobile-nav" id="mobileNav" aria-label="الانتقال إلى قسم">
      <option value="top">الرئيسية</option>
      <option value="intro">المقدمة</option>
      <option value="sections">الأقسام</option>
      <option value="gallery">معرض التجارب</option>
      <option value="contact">التواصل</option>
    </select>
    <button class="lock-btn" id="lockBtn" title="دخول لإدارة الشواهد" aria-label="دخول لإدارة الشواهد">
      <i data-lucide="lock"></i>
    </button>
  </div>
</header>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <h3 class="font-display">دخول إدارة الشواهد</h3>
    <p>أدخل الرمز الخاص بك لتفعيل وضع رفع الشواهد.</p>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="الرمز" autocomplete="off">
    <div class="pin-actions">
      <button class="btn ghost" type="button" id="pinCancel">إلغاء</button>
      <button class="btn solid" type="button" id="pinSubmit">دخول</button>
    </div>
    <p class="pin-error" id="pinError">الرمز غير صحيح</p>
  </div>
</div>

<div class="edit-banner" id="editBanner">
  <span><i data-lucide="unlock"></i></span>
  <span>وضع إدارة الشواهد مفعّل — أي شاهد ترفعه يظهر لك فورًا</span>
  <button id="exportBtn" type="button"><i data-lucide="download"></i> تنزيل نسخة محدثة من الموقع</button>
  <button id="lockOutBtn" type="button" class="lock-out">خروج</button>
</div>

<main id="content"></main>

هارات والجوائز","text":"المهارات التقنية والتربوية، وما حصل عليه من شهادات شكر وتكريم وجوائز.","ex":["إتقان برامج الرسم الجزيئي","حصول على شهادة شكر في اليوم العالمي للكيمياء"]}]},{"id":"duties","n":"٠٤","icon":"flask-conical","title":"أداء الواجبات الوظيفية","text":"شواهد على الالتزام بأداء المهام اليومية لمعلّم الكيمياء: تحضير الدروس النظرية، إعداد التجارب المختبرية، متابعة السلامة، وتنفيذ الأعمال الإدارية بإتقان.","subs":[{"title":"إعداد الدروس النظرية والعملية","text":"تحضير دروس الكيمياء بربطها بالحياة اليومية، وتصميم تجارب توضيحية تُثري فهم المفاهيم الكيميائية.","ex":["تحضير درس التفاعلات الكيميائية بأمثلة من الطبيعة","ربط درس الأحماض والقواعد بالمنتجات المنزلية"]},{"title":"إعداد التجارب المختبرية","text":"تهيئة القوارير والمحاليل وأدوات القياس، وكتابة بطاقات السلامة الخاصة بكل تجربة قبل تنفيذها.","ex":["تجهيز تجربة تفاعل المعادن مع الأحماض","فحص جاهزية أدوات القياس والميزان"],"evidence":[{"type":"image","label":"صورة تجربة (مثال)","src":"data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNDgwIDMyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iYmciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2VhZmFmMSIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiNmZWYzZTciLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSI0ODAiIGhlaWdodD0iMzIwIiBmaWxsPSJ1cmwoI2JnKSIvPgogIDxyZWN0IHg9IjEiIHk9IjEiIHdpZHRoPSI0NzgiIGhlaWdodD0iMzE4IiBmaWxsPSJub25lIiBzdHJva2U9IiNjOWU4ZDYiIHN0cm9rZS13aWR0aD0iMiIvPgoKICA8IS0tIGZsYXNrIGljb24gLS0+CiAgPGcgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMTk4LDM4KSBzY2FsZSgwLjg1KSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWY5ZDZmIiBzdHJva2Utd2lkdGg9IjQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNMzUgOGgzMCBNNDIgOHYzNCBMMTggOTZhMTAgMTAgMCAwIDAgOSAxNWg1NmExMCAxMCAwIDAgMCA5LTE1TDY4IDQyVjgiLz4KICAgIDxwYXRoIGQ9Ik0yOCA3OGg0NCIgc3Ryb2tlPSIjZTA4YTJlIi8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjIxOSIgY3k9IjEwOCIgcj0iMyIgZmlsbD0iI2UwOGEyZSIvPgogIDxjaXJjbG  الكيمياء بالمجتمع المحلي والبيئة والاستدامة.","subs":[{"title":"الفعاليات العلمية","text":"المشاركة في اليوم العالمي للكيمياء وأسبوع العلوم والمعارض العلمية.","ex":["إعداد ركن كيميائي في أسبوع العلوم","تنظيم فعالية اليوم العالمي للكيمياء"]},{"title":"الشراكات المجتمعية","text":"التعاون مع الجامعات والمراكز العلمية والمختبرات المحلية في برامج تخدم الطلاب.","ex":["زيارة طلابية لمختبر جامعي","محاضرة ضيف من أخصائي كيمياء"]},{"title":"توظيف موارد المجتمع","text":"الاستفادة من خبرات مختصين في مجالات الكيمياء لإثراء الأنشطة التعليمية.","ex":["استضافة كيميائي من الصناعة","توظيف تجارب من البيئة المحلية"]},{"title":"تعزيز الوعي البيئي","text":"ربط دروس الكيمياء بالاستدامة والمواد الصديقة للبيئة وحماية الموارد.","ex":["درس عن إعادة التدوير","تجربة تنقية المياه"]}]},{"id":"classroom","n":"٠٩","icon":"microscope","title":"الإدارة الصفية والمختبرية","text":"بيئة صفية ومختبرية منظمة وآمنة تشجع على التعلم والاكتشاف، مع قواعد واضحة وتعزيز إيجابي.","subs":[{"title":"تنظيم البيئة الصفية والمختبرية","text":"ترتيب الفصل والمختبر وتجهيزه بما يدعم التعلم، من سبورات تفاعلية وأركان تعليمية ولوحات محفزة.","ex":["ركن السلامة في المختبر","لوحة إنجازات الطلاب"]},{"title":"قواعد السلامة الصفية","text":"قواعد واضحة متفق عليها مع الطلاب تنظم دخول الدرس والمشاركة وأداء التجارب.","ex":["قواعد ارتداء المريلة والنظارات","إجراءات الطوارئ في المختبر"]},{"title":"التعزيز الإيجابي","text":"أساليب تحفيز متنوعة، مثل لوحات الشرف ونقاط التميز وشهادات الشكر للطلاب.","ex":["شهادة كيميائي المختبر","نقاط للمشاركة الفعالة"]},{"title":"التعامل مع المشكلات السلوكية","text":"استراتيجيات تربوية لمعالجة السلوكيات غير المرغوبة بما يحفظ كرامة الطالب ويحافظ على السلامة.","ex":["تدخل فوري عند إهمال قواعد السلامة","حوار تربوي بعد الحصة"]}]},{"id":"planning","n":"١٠","icon":"calendar-check","title":"إعداد وتنفيذ خطة التعلم","text":"تخطيط وحدات الكيمياء بأهداف واضحة وتجارب مرتبطة وتقويم بنائي، مع توثيق التنفيذ والتحسين المستمر.","subs":[{"title":"الخطة الفصلية والسنوية","text":"توزيع منهج الكيمياء على أسابيع الفصل الدراسي وفق التقويم المدرسي وبما يحقق نواتج التعلم.","ex":["خطة زمنية لكل وحدة","ربط الوحدات بالتجارب المناسبة"]},{"title":"تحضير الدروس والتجارب","text":"نماذج من تحضير الدروس بأهداف سلوكية واضحة واستراتيجيات مناسبة وأنشطة متنوعة.","ex":["تحضير درس معادلة الاحتراق","اختيار تجربة توضيحية لكل درس"]},{"title":"التقويم البنائي والختامي","text":"أدوات تقويم متنوعة، من التقويم القبلي والبنائي إلى الاختبارات والتقييم الذاتي.","ex":["اختبار قصير بعد كل درس","تقييم أداء المختبر"]},{"title":"توثيق التنفيذ والتحسين","text":"توثيق سير تنفيذ الخطة، ومراجعتها وتطويرها باستمرار بناءً على النتائج والملاحظات.","ex":["سجل تنفيذ الخطة الأسبوعي","مراجعة الخطة بعد كل اختبار"]}]}],"labs":{"molecular":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>تدرج خواص العناصر</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#EEF2F7;--panel:#FFFFFF;--ink:#14213D;--muted:#5A6782;--line:#D5DCE8;--soft:#F4F7FB;\n  --gold:#F2B705;--good:#12A150;--bad:#D93A3A;--cat:#E5484D;--an:#3E63DD;--acc:#0F9D8A;\n  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--bg:#0F1626;--panel:#172136;--ink:#E7EDF8;--muted:#9AA8C4;--line:#2A3757;--soft:#1C2842;}}\n:root[data-theme=\"dark\"]{--bg:#0F1626;--panel:#172136;--ink:#E7EDF8;--muted:#9AA8C4;--line:#2A3757;--soft:#1C2842;}\n*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"IBM Plex Sans Arabic\",Tahoma,\"Segoe UI\",sans-serif;font-size:16px;line-height:1.65}\nbutton,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n.ltr{direction:ltr;unicode-bidi:isolate}\n\n/* top bar */\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}\n.bar h1{margin:0;font-size:1.15rem;line-height:1.3}\n.bar p{margin:0;font-size:.8rem;color:var(--muted)}\n.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:none;min-height:40px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}\n.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}\n\nmain{max-width:560px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}\n.view{display:none}.view.on{display:block;animation:fade .25s ease-out}\n@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}\n.card h2{margin:0 0 8px;font-size:1.05rem}\n.muted{color:var(--muted);font-size:.88rem}\n\n/* bottom nav */\nnav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}\nnav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;padding:4px 0;min-height:52px;cursor:pointer;color:var(--muted);border-radius:12px}\nnav.tabs button .i{font-size:1.35rem;line-height:1.2}\nnav.tabs button.on{color:var(--ink);font-weight:700;background:var(--soft)}\n\n/* grid */\n.pt{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}\n.gn{text-align:center;font-size:.68rem;color:var(--muted)}\n.cell{position:relative;aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--soft);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}\n.cell .sy{position:relative;z-index:1;font-weight:700;font-size:.95rem}\n.cell .q{position:absolute;top:1px;right:3px;font-size:.6rem;font-weight:700;z-index:1}\n.cell .dot{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);transition:width .35s,height .35s}\n.cell.na{opacity:.4}\n.cell.sel{box-shadow:0 0 0 3px var(--gold);z-index:2}\n.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}\n.ramp{flex:1;min-width:80px;height:10px;border-radius:6px}\n\n.arrows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}\n.arr{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:.86rem;line-height:1.35}\n.arr b{display:block;font-size:.78rem;color:var(--muted);font-weight:500}\n.arr .ico{font-size:1.5rem;color:var(--acc);font-weight:700;flex:none}\n\n/* detail */\n.dhead{display:flex;gap:12px;align-items:center}\n.tile{width:78px;height:86px;border-radius:14px;border:3px solid var(--acc);display:flex;flex-direction:column;justify-content:space-between;padding:4px 7px;direction:ltr;flex:none}\n.tile .tz{font-size:.8rem;font-weight:700}.tile .ts{font-size:2rem;font-weight:700;text-align:center;line-height:1}.tile .tn{font-size:.72rem;text-align:center;direction:rtl}\n.val{font-size:1.9rem;font-weight:700;line-height:1.1}\n.val small{font-size:.85rem;color:var(--muted);font-weight:500}\n.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:0 9px;font-size:.78rem;margin:4px 0 0 4px}\n.why{margin-top:12px;border-inline-start:4px solid var(--acc);background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem}\n.why p{margin:5px 0}\ndetails{margin-top:10px}\nsummary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}\n.svgw svg{width:100%;height:auto;display:block}\n\n/* rows chart */\n.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}\n.seg button{flex:1;border:0;background:transparent;min-height:42px;font-weight:700;cursor:pointer}\n.seg button.on{background:var(--ink);color:var(--panel)}\n.rows{display:flex;flex-direction:column;gap:7px;margin-top:8px}\n.rw{display:grid;grid-template-columns:50px 36px 1fr;align-items:center;gap:8px}\n.rw.nocirc{grid-template-columns:50px 1fr}\n.rw .s{font-weight:700;text-align:center;background:var(--soft);border-radius:8px;padding:3px 0;font-size:.95rem}\n.rw .c{display:flex;align-items:center;justify-content:center;height:36px}\n.rw .c i{display:block;border-radius:50%}\n.track{position:relative;height:30px;background:var(--soft);border-radius:8px;overflow:hidden}\n.fill{position:absolute;top:0;bottom:0;right:0;border-radius:8px;transform-origin:right;animation:grow .6s ease-out}\n.num{position:absolute;top:50%;transform:translateY(-50%);left:8px;font-weight:700;font-size:.85rem;direction:ltr}\n@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n.note{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem}\n.selrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}\nselect{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px}\n.sum{display:grid;gap:8px}\n.sum div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem}\n.sum b{display:block;font-size:.95rem}\n.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}\n\n.btn{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--ink);color:var(--panel);font-weight:700;cursor:pointer;margin-top:8px}\n.odot{transition:transform .9s cubic-bezier(.4,1.4,.5,1),opacity .9s}\n.cfg sup{font-size:.65em;font-weight:700}\n\n.qtext{font-size:1.08rem;font-weight:700;margin:4px 0 10px}\n.opts{display:grid;gap:8px}\n.opt{min-height:52px;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:1rem;font-weight:500;text-align:right}\n.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}\n.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}\n.score{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}\n.fb{margin-top:10px;font-size:.93rem}\n#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}\n#confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.2s ease-out forwards}\n@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n@media (min-width:700px){main{max-width:640px}}\n</style>\n</head>\n<body>\n<div id=\"confetti\"></div>\n<header class=\"bar\">\n  <h1 id=\"title\">تدرج خواص العناصر</h1>\n  <p id=\"subtitle\">كيمياء 2-1</p>\n  <div class=\"chips\" id=\"chips\"></div>\n</header>\n\n<main>\n  <!-- map -->\n  <section class=\"view on\" id=\"v-map\">\n    <div class=\"card\">\n      <div class=\"pt\" id=\"pt\"></div>\n      <div class=\"legend\" id=\"legend\"></div>\n      <div class=\"arrows\" id=\"arrows\"></div>\n    </div>\n    <div class=\"card\" id=\"detail\"></div>\n  </section>\n\n  <!-- trend -->\n  <section class=\"view\" id=\"v-trend\">\n    <div class=\"card\">\n      <h2>تتبّع التدرج</h2>\n      <div class=\"seg\" id=\"lineSeg\"><button data-v=\"period\" class=\"on\">عبر الدورة</button><button data-v=\"group\">في المجموعة</button></div>\n      <div class=\"chips\" id=\"lineChips\" style=\"padding-top:0\"></div>\n      <div class=\"rows\" id=\"lineRows\"></div>\n      <div class=\"note\" id=\"lineNote\"></div>\n    </div>\n    <div class=\"card\">\n      <h2>قارن بين عنصرين</h2>\n      <div class=\"selrow\"><select id=\"cmpA\" aria-label=\"العنصر الأول\"></select><span class=\"muted\">مقابل</span><select id=\"cmpB\" aria-label=\"العنصر الثاني\"></select></div>\n      <div class=\"rows\" id=\"cmpRows\"></div>\n      <div class=\"note\" id=\"cmpNote\"></div>\n    </div>\n    <div class=\"card\">\n      <h2>الملخص</h2>\n      <div class=\"sum\">\n        <div><b>نصف قطر الذرة</b>عبر الدورة <span class=\"dn\">يقل</span>، وفي المجموعة <span class=\"up\">يزداد</span></div>\n        <div><b>نصف قطر الأيون</b>عبر الدورة تقل الموجبة ثم تظهر السالبة الأكبر وتقل تدريجياً، وفي المجموعة <span class=\"up\">يزداد</span></div>\n        <div><b>طاقة التأين الأولى</b>عبر الدورة <span class=\"up\">تزداد</span>، وفي المجموعة <span class=\"dn\">تقل</span></div>\n        <div><b>الكهروسالبية</b>عبر الدورة <span class=\"up\">تزداد</span>، وفي المجموعة <span class=\"dn\">تقل</span></div>\n      </div>\n    </div>\n  </section>\n\n  <!-- successive IE -->\n  <section class=\"view\" id=\"v-ie\">\n    <div class=\"card\">\n      <h2>طاقات التأين المتتالية</h2>\n      <select id=\"sieSel\" aria-label=\"اختر عنصراً\"></select>\n      <div class=\"rows\" id=\"sieRows\"></div>\n      <div class=\"note\" id=\"sieNote\"></div>\n    </div>\n  </section>\n\n  <!-- octet -->\n  <section class=\"view\" id=\"v-oct\">\n    <div class=\"card\">\n      <h2>القاعدة الثمانية</h2>\n      <select id=\"octSel\" aria-label=\"اختر عنصراً\"></select>\n      <div class=\"svgw\" id=\"oct\" style=\"margin-top:6px\"></div>\n      <button class=\"btn\" id=\"octGo\">▶ طبّق القاعدة الثمانية</button>\n      <div class=\"note\" id=\"octNote\"></div>\n    </div>\n  </section>\n\n  <!-- quiz -->\n  <section class=\"view\" id=\"v-quiz\">\n    <div class=\"card\">\n      <div class=\"score\"><span>النقاط: <b id=\"sc\">0</b> من <b id=\"tot\">0< map(x=>({t:\"المجموعة \"+x,ok:x===g})),\n    why:`القفزة الكبيرة بعد الإلكترون ${valOf(e)} تعني ${valOf(e)} إلكترونات تكافؤ، إذن العنصر ${e.name} في المجموعة ${g}.`};}\nfunction newQ(){const t=Math.floor(Math.random()*5),Q=t<3?pairQ([\"r\",\"ie\",\"en\"][t]):t===3?ionQ():sieQ();\n  $(\"qtext\").textContent=Q.q;$(\"fb\").innerHTML=\"\";$(\"opts\").innerHTML=Q.opts.map(o=>`<button class=\"opt\" data-ok=\"${o.ok}\">${o.t}</button>`).join(\"\");\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>{const ok=b.dataset.ok===\"true\";total++;\n    document.querySelectorAll(\".opt\").forEach(x=>{x.disabled=true;if(x.dataset.ok===\"true\")x.classList.add(\"right\");});\n    if(ok){score++;streak++;const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,streak%5===0?60:24);\n      if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}\n      $(\"fb\").innerHTML=`<b style=\"color:var(--good)\">${streak%5===0?\"سلسلة رائعة! \"+streak+\" 🏆\":\"إجابة صحيحة ✓\"}</b> ${Q.why}`;}\n    else{streak=0;b.classList.add(\"wrong\");$(\"fb\").innerHTML=`<b style=\"color:var(--bad)\">ليست صحيحة.</b> ${Q.why}`;}\n    $(\"sc\").textContent=score;$(\"tot\").textContent=total;$(\"stk\").textContent=streak;});}\nfunction burst(x,y,n){if(matchMedia(\"(prefers-reduced-motion: reduce)\").matches)return;const box=$(\"confetti\"),c=[\"#0F9D8A\",\"#D9531E\",\"#6D3FD4\",\"#F2B705\",\"#3E63DD\"];\n  for(let i=0;i<n;i++){const e=document.createElement(\"i\");e.style.left=x+\"px\";e.style.top=y+\"px\";e.style.background=c[i%5];e.style.setProperty(\"--dx\",(Math.random()*280-140)+\"px\");e.style.setProperty(\"--dy\",(Math.random()*240-190)+\"px\");box.appendChild(e);setTimeout(()=>e.remove(),1300);}}\n$(\"nextQ\").onclick=newQ;\n\nfunction renderAll(){renderMap();renderLine();renderCmp();}\n$(\"subtitle\").textContent=TITLES.map;\nrenderAll();renderSIE();renderOct(false);newQ();\n<\/script>\n</body>\n</html>\n","lesson":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مختبر التوزيع الإلكتروني</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#EEF2F7;--panel:#FFFFFF;--ink:#14213D;--muted:#5A6782;--line:#D5DCE8;\n  --s:#E5484D;--p:#0E9F86;--d:#4F63E8;--f:#D4860B;--gold:#F2B705;--gold-soft:#FFF4CC;\n  --s-soft:#FCE4E4;--p-soft:#D8F3EC;--d-soft:#E2E6FC;--f-soft:#FBEBCF;\n  --good:#12A150;--bad:#D93A3A;\n  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0F1626;--panel:#172136;--ink:#E7EDF8;--muted:#9AA8C4;--line:#2A3757;\n    --s-soft:#3A1E26;--p-soft:#123430;--d-soft:#1E2550;--f-soft:#3A2A10;--gold-soft:#3A3212;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0F1626;--panel:#172136;--ink:#E7EDF8;--muted:#9AA8C4;--line:#2A3757;\n  --s-soft:#3A1E26;--p-soft:#123430;--d-soft:#1E2550;--f-soft:#3A2A10;--gold-soft:#3A3212;\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"IBM Plex Sans Arabic\",Tahoma,\"Segoe UI\",sans-serif;line-height:1.6}\n.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}\n.ltr{direction:ltr;unicode-bidi:isolate}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\nheader{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}\nh1{margin:0;font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.2;font-weight:700;letter-spacing:-.01em}\n.sub-h{margin:4px 0 0;color:var(--muted
