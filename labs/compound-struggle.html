<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صراع المركبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Classroom projector board: deep lab-navy surface, molecule-ball accents (cyan, gold, orange), one committed dark world */
  --bg:#0B1B33; --panel:#122A4C; --panel-2:#183660; --line:#2A4D7E;
  --ink:#F3F7FF; --muted:#9FB4D4;
  --cyan:#3FC7EE; --gold:#FFC23D; --orange:#FF8A4C; --lime:#9BE15D;
  --ok:#2FD07A; --bad:#FF5A5F;
  --display:"Cairo", "Segoe UI", Tahoma, sans-serif;
  --body:"Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme:dark;
  /* layout: scoreboard strip on top, 4×3 question board below; a question opens as a full-stage card */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 85% -10%,#1C3F73 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
sub{font-size:.62em;vertical-align:-.25em;line-height:0}
.wrap{width:min(1400px,100% - 32px);margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:12px 0 14px;flex:1;min-height:0}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(26px,3.2vw,44px);letter-spacing:0;text-wrap:balance}
h1 span{color:var(--gold)}
.tag{font-size:15px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 14px;border-radius:999px}
.spacer{flex:1}
.tool{background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:12px;font-weight:700;font-size:15px}
.tool:hover{background:var(--panel-2)}
/* scoreboard */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.team{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:12px;position:relative}
.team .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.team input{background:transparent;border:0;color:var(--ink);font:700 20px var(--body);width:100%;min-width:0;padding:2px 0;border-bottom:1px dashed transparent}
.team input:hover,.team input:focus{border-bottom-color:var(--muted);outline:none}
.score{font:900 34px var(--display);font-variant-numeric:tabular-nums;min-width:70px;text-align:left}
.team.lead{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.18)}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{background:var(--panel-2);width:26px;height:22px;border-radius:6px;font-weight:800;font-size:14px;line-height:1}
/* board */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto repeat(6,1fr);gap:8px}
.cat{background:var(--panel-2);border-radius:16px;padding:12px 10px;text-align:center;font:800 clamp(16px,1.7vw,24px)/1.25 var(--display);display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:4px solid var(--c)}
.cat svg{flex:0 0 auto}
.tile{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:2px solid var(--line);border-radius:18px;font:900 clamp(22px,2.8vw,40px) var(--display);color:var(--c);font-variant-numeric:tabular-nums;transition:transform .15s,border-color .15s;min-height:46px;border-radius:14px}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.tile.used{color:transparent;background:rgba(18,42,76,.45);border-style:dashed;transform:none;cursor:default;position:relative}
.tile.used::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:26px}
/* question stage */
.stage{position:fixed;inset:0;background:rgba(5,14,28,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.stage.open{display:flex}
.card{width:min(1200px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:22px;border-top:8px solid var(--c)}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qcat{font:800 20px var(--display);color:var(--c)}
.qval{font:900 20px var(--display);background:var(--c);color:var(--bg);padding:2px 16px;border-radius:999px}
.timer{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.ring{--p:100;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--panel-2) 0);display:grid;place-items:center}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:900 26px var(--display);font-variant-numeric:tabular-nums}
.ring.low{background:conic-gradient(var(--bad) calc(var(--p)*1%),var(--panel-2) 0)}
.qtext{font:800 clamp(26px,3.4vw,48px)/1.45 var(--display);text-wrap:balance;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt{background:var(--panel-2);border:3px solid var(--line);border-radius:18px;padding:18px 20px;font:700 clamp(20px,2.2vw,30px)/1.4 var(--body);text-align:right;display:flex;align-items:center;gap:14px}
.opt:hover{border-color:var(--muted)}
.opt .k{flex:0 0 46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:900}
.opt.right{border-color:var(--ok);background:rgba(47,208,122,.18)}
.opt.right .k{background:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:rgba(255,90,95,.14);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
.why{display:none;background:rgba(47,208,122,.12);border:2px solid var(--ok);border-radius:16px;padding:14px 20px;font:700 clamp(18px,1.9vw,26px)/1.5 var(--body)}
.why.show{display:block}
.why b{color:var(--ok)}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel-2);border:2px solid var(--line);padding:12px 22px;border-radius:14px;font:800 18px var(--body)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.award{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.award.show{display:flex}
.award .lbl{font-weight:800;color:var(--muted)}
.award button{padding:10px 18px;border-radius:14px;font:800 18px var(--body);background:var(--panel-2);border:2px solid var(--tc)}
.award button:hover{background:var(--tc);color:var(--bg)}
.hint{font-size:14px;color:var(--muted);text-align:center}
/* winner */
.win{position:fixed;inset:0;background:rgba(5,14,28,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;text-align:center;padding:16px}
.win.open{display:flex}
.win h2{margin:0;font:900 clamp(40px,6vw,84px) var(--display);color:var(--gold)}
.win .podium{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.win .p{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 24px;min-width:180px}
.win .p b{display:block;font:900 40px var(--display);font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:760px){.board{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.cat{font-size:13px;padding:8px 4px;flex-direction:column;gap:4px}.tile{font-size:24px;min-height:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>صراع <span>المركبات</span></h1>
    <span class="tag">كيم 102 • المركبات الكيميائية</span><span class="tag">30 سؤالًا</span>
    <span class="spacer"></span>
    <button class="tool" id="teamCount" title="عدد الفرق">عدد الفرق: 2</button>
    <button class="tool" id="finish">إعلان الفائز</button>
    <button class="tool" id="reset">لعبة جديدة</button>
  </header>
  <section class="teams" id="teams" aria-label="لوحة النقاط"></section>
  <section class="board" id="board" aria-label="لوحة الأسئلة"></section>
  <p class="hint">اختر سؤالًا ← يجيب الفريق ← اضغط على الخيار الذي اختاره الطلاب أو «إظهار الإجابة» ← امنح النقاط. يمكنك تعديل أسماء الفرق بالضغط عليها.</p>
</div>

<div class="stage" id="stage" role="dialog" aria-modal="true" aria-labelledby="qtext">
  <div class="card" id="card">
    <div class="qhead">
      <span class="qcat" id="qcat"></span><span class="qval" id="qval"></span>
      <div class="timer"><button class="btn" id="tbtn">ابدأ المؤقت</button><div class="ring" id="ring"><b id="tnum">30</b></div></div>
    </div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <div class="why" id="why"></div>
    <div class="ctrl">
      <button class="btn primary" id="reveal">إظهار الإجابة</button>
      <button class="btn" id="swap">سؤال رموز إضافي ↻</button>
      <div class="award" id="award"><span class="lbl">امنح النقاط:</span></div>
      <span class="spacer"></span>
      <button class="btn" id="back">العودة للوحة</button>
    </div>
  </div>
</div>

<div class="win" id="win"><h2 id="wtitle"></h2><div class="podium" id="podium"></div><button class="btn" id="wclose">العودة للوحة</button></div>
<canvas id="fx"></canvas>

<script>

// ---------- data ----------
const EL={ // symbol: [Arabic name, metal?]
 Na:['الصوديوم',1],K:['البوتاسيوم',1],Li:['الليثيوم',1],Mg:['المغنيسيوم',1],Ca:['الكالسيوم',1],Ba:['الباريوم',1],Al:['الألومنيوم',1],
 Fe:['الحديد',1],Cu:['النحاس',1],Zn:['الخارصين',1],Ag:['الفضة',1],Au:['الذهب',1],Pb:['الرصاص',1],Sn:['القصدير',1],Hg:['الزئبق',1],Ni:['النيكل',1],
 H:['الهيدروجين',0],C:['الكربون',0],N:['النيتروجين',0],O:['الأكسجين',0],F:['الفلور',0],Cl:['الكلور',0],Br:['البروم',0],I:['اليود',0],
 S:['الكبريت',0],P:['الفوسفور',0],He:['الهيليوم',0],Ne:['النيون',0]};
const EASY=['H','C','N','O','Na','Mg','Ca','Cl','S','Fe','Cu','Al','F','He','Li','Zn'];
const TRICKY=['K','Na','Fe','Cu','Ag','Au','Pb','Sn','Hg'];
const ELEMSUB=[['Fe','الحديد'],['Cu','النحاس'],['Mg','المغنيسيوم'],['Al','الألومنيوم'],['Zn','الخارصين'],['Ag','الفضة'],['Au','الذهب'],['S','الكبريت'],['C','الكربون'],['He','الهيليوم'],['Ne','النيون'],
 ['O2','الأكسجين'],['N2','النيتروجين'],['H2','الهيدروجين'],['Cl2','الكلور'],['I2','اليود'],['Br2','البروم'],['F2','الفلور']];
const COMP=[ // formula, name, ionic?
 ['NaCl','ملح الطعام',1],['KCl','كلوريد البوتاسيوم',1],['KI','يوديد البوتاسيوم',1],['KBr','بروميد البوتاسيوم',1],['NaF','فلوريد الصوديوم',1],
 ['NaBr','بروميد الصوديوم',1],['LiCl','كلوريد الليثيوم',1],['MgO','أكسيد المغنيسيوم',1],['CaO','أكسيد الكالسيوم',1],['MgCl2','كلوريد المغنيسيوم',1],
 ['CaCl2','كلوريد الكالسيوم',1],['BaCl2','كلوريد الباريوم',1],['Al2O3','أكسيد الألومنيوم',1],['ZnO','أكسيد الخارصين',1],['FeCl3','كلوريد الحديد',1],
 ['CuO','أكسيد النحاس',1],['Na2O','أكسيد الصوديوم',1],['K2S','كبريتيد البوتاسيوم',1],['CaF2','فلوريد الكالسيوم',1],['AgCl','كلوريد الفضة',1],
 ['H2O','الماء',0],['CO2','ثاني أكسيد الكربون',0],['CO','أول أكسيد الكربون',0],['CH4','الميثان',0],['NH3','الأمونيا',0],['HCl','كلوريد الهيدروجين',0],
 ['HF','فلوريد الهيدروجين',0],['H2S','كبريتيد الهيدروجين',0],['SO2','ثاني أكسيد الكبريت',0],['SO3','ثالث أكسيد الكبريت',0],['NO2','ثاني أكسيد النيتروجين',0],
 ['CCl4','رباعي كلوريد الكربون',0],['PCl3','ثلاثي كلوريد الفوسفور',0],['C6H12O6','الجلوكوز',0],['H2O2','فوق أكسيد الهيدروجين',0],['CS2','ثنائي كبريتيد الكربون',0]];
const FIXED={
 1:[{q:'خواص المركب مقارنةً بخواص العناصر المكوّنة له:',o:['تشبهها','تختلف عنها'],a:1,w:'<b>تختلف عنها</b>؛ فالمركب مادة جديدة بخواص جديدة.'},
    {q:'الشحنة الكلية لأي مركب:',o:['موجبة','سالبة','متعادلة'],a:2,w:'<b>متعادلة</b>؛ فكل المركبات متعادلة الشحنة.'},
    {q:'المركب مادة تتكون من:',o:['نوع واحد من الذرات','عنصرين مختلفين أو أكثر متحدين كيميائيًا','عناصر مخلوطة يسهل فصلها'],a:1,w:'<b>عنصرين مختلفين أو أكثر متحدين كيميائيًا.</b>'}],
 2:[{q:'هل يمكن فصل مكونات المركب بالترشيح؟',o:['نعم','لا'],a:1,w:'<b>لا</b>؛ المركب يُفصل بطرق كيميائية مثل التحليل الكهربائي.'},
    {q:'ما الغاز الذي يتصاعد عند الكاثود (−) في تحليل الماء؟',o:['الأكسجين','الهيدروجين'],a:1,w:'<b>الهيدروجين H<sub>2</sub></b> عند الكاثود.'},
    {q:'ما الغاز الذي يتصاعد عند الأنود (+) في تحليل الماء؟',o:['الأكسجين','الهيدروجين'],a:0,w:'<b>الأكسجين O<sub>2</sub></b> عند الأنود.'},
    {q:'نفصل الماء إلى عناصره بطريقة:',o:['الترشيح','التبخير','التحليل الكهربائي','المغناطيس'],a:2,w:'<b>التحليل الكهربائي</b>، وهي طريقة كيميائية.'}],
 3:[{q:'إذا كان حجم الهيدروجين 30 cm³، فكم حجم الأكسجين؟',o:['15 cm³','30 cm³','60 cm³'],a:0,w:'<b>15 cm³</b>؛ لأن حجم الهيدروجين ضعف حجم الأكسجين.'},
    {q:'إذا كان حجم الأكسجين 20 cm³، فكم حجم الهيدروجين؟',o:['10 cm³','20 cm³','40 cm³'],a:2,w:'<b>40 cm³</b>؛ لأن حجم الهيدروجين ضعف حجم الأكسجين.'},
    {q:'لماذا يكون حجم الهيدروجين ضعف حجم الأكسجين؟',o:['لأن الهيدروجين أثقل','لأن في جزيء الماء ذرتي هيدروجين لكل ذرة أكسجين','لأن الكاثود أكبر من الأنود'],a:1,w:'لأن في جزيء الماء <b>H<sub>2</sub>O</b> ذرتي هيدروجين لكل ذرة أكسجين.'},
    {q:'الصوديوم يتفاعل بعنف والكلور غاز سام… فلماذا نأكل ملح الطعام بأمان؟',o:['لأن الملح مخلوط منهما','لأنهما اتحدا كيميائيًا فتكوّن مركب بخواص جديدة','لأن الطهي يزيل السمّية'],a:1,w:'<b>اتحدا كيميائيًا</b>، فتكوّن مركب خواصه مختلفة عن عنصريه.'},
    {q:'لماذا نحتاج طاقة كهربائية لتفكيك الماء؟',o:['لأن المركب أكثر استقرارًا من عناصره','لأن الماء سائل','لأن الأكسجين غاز'],a:0,w:'لأن <b>المركب أكثر استقرارًا</b> من عناصره، فيحتاج طاقة لتفكيكه.'}]};
// ---------- helpers ----------
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const F=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const els=f=>[...new Set(f.match(/[A-Z][a-z]?/g))];
const isEl=f=>els(f).length===1;
function mc(q,correct,wrongs,w,key){const o=shuf([correct,...wrongs]);return{q,o,a:o.indexOf(correct),w,key}}
function bin(q,o,a,w,key){return{q,o,a,w,key}}
function reasonIC(f){const e=els(f),m=e.filter(x=>EL[x][1]),n=e.filter(x=>!EL[x][1]);
  return m.length?`${m.join(' و ')} فلز + ${n.join(' و ')} لافلز`:`${e.join(' و ')} ${e.length>1?'لافلزات':'لافلز'}${e.includes('H')?' (الهيدروجين لافلز رغم مكانه في المجموعة الأولى)':''}`}
function reasonEC(f,name){const e=els(f);return e.length===1?`نوع واحد من الذرات (${EL[e[0]][0]})`:`يتكون من عناصر مختلفة: ${e.join(' و ')}`}
// ---------- generators: (level 0..2) -> question ----------
const GEN=[
 // 0: رموز العناصر
 lv=>{ if(lv===0&&Math.random()<.35){const s=rnd(EASY);return mc(`ما اسم العنصر الذي رمزه <span dir="ltr">${s}</span>؟`,EL[s][0],shuf(EASY.filter(x=>x!==s)).slice(0,3).map(x=>EL[x][0]),`<b>${s}</b> رمز ${EL[s][0]}.`,'sym0n'+s)}
       if(lv===2&&Math.random()<.4){const s=rnd(Object.keys(EL).filter(x=>!TRICKY.includes(x)));return mc(`ما رمز عنصر <u>${EL[s][0]}</u>؟`,s,shuf(Object.keys(EL).filter(x=>x!==s&&x[0]===s[0]).concat(shuf(Object.keys(EL).filter(x=>x[0]!==s[0])))).slice(0,3),`رمز ${EL[s][0]} هو <b>${s}</b>.`,'sym2b'+s)}
       if(lv===0){const s=rnd(EASY);return mc(`ما رمز عنصر <u>${EL[s][0]}</u>؟`,s,shuf(Object.keys(EL).filter(x=>x!==s)).slice(0,3),`رمز ${EL[s][0]} هو <b>${s}</b>.`,'sym0'+s)}
       if(lv===1){const s=rnd(Object.keys(EL));return mc(`ما اسم العنصر الذي رمزه <span dir="ltr">${s}</span>؟`,EL[s][0],shuf(Object.keys(EL).filter(x=>x!==s)).slice(0,3).map(x=>EL[x][0]),`<b>${s}</b> رمز ${EL[s][0]}.`,'sym1'+s)}
       const s=rnd(TRICKY);return mc(`انتبه! ما رمز عنصر <u>${EL[s][0]}</u>؟`,s,shuf(TRICKY.filter(x=>x!==s)).slice(0,3),`رمز ${EL[s][0]} هو <b>${s}</b> (مشتق من اسمه اللاتيني).`,'sym2'+s)},
 // 1: فلز أم لافلز
 lv=>{ if(lv<2){const pool=lv===0?['Na','Mg','Fe','Cu','O','Cl','N','C','K','Ca']:['Al','Zn','Ag','Pb','S','P','Br','I','F','Li','Hg','Sn'];const s=rnd(pool);
         return bin(`العنصر <span dir="ltr">${s}</span> (${EL[s][0]}): فلز أم لافلز؟`,['فلز','لافلز'],EL[s][1]?0:1,`<b>${EL[s][1]?'فلز':'لافلز'}</b>.`,'ml'+s)}

$('swap').onclick=()=>{if(!cur)return;fillQ(makeQ(cur.ci,cur.r));stopTimer();left=30;drawTimer();$('tbtn').textContent='ابدأ المؤقت'};
$('back').onclick=closeQ;
document.addEventListener('keydown',e=>{if(!cur)return;if(e.key==='Escape')closeQ();if(e.key===' '&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('tbtn').click()}});
$('teamCount').onclick=()=>{const n=S.teams.length%4+1<2?2:S.teams.length%4+1;const next=n===1?2:n;
  while(S.teams.length<next)S.teams.push({name:TNAMES[S.teams.length],score:0});S.teams.length=next;save();renderTeams()};
$('reset').onclick=()=>{seen.clear();S=fresh(S.teams.length);S.teams.forEach((t,i)=>t.name=($('tn'+i)||{}).value||t.name);save();renderTeams();renderBoard()};
$('finish').onclick=()=>{
  const sorted=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top=sorted[0],tie=sorted.filter(t=>t.score===top.score).length>1;
  $('wtitle').textContent=tie?'تعادل! أحسنتم جميعًا':'الفائز: '+top.name;
  $('podium').innerHTML=sorted.map(t=>`<div class="p" style="border-color:${TCOL[t.i]}">${t.name}<b style="color:${TCOL[t.i]}">${t.score}</b></div>`).join('');
  $('win').classList.add('open');good();burst(160);
};
$('wclose').onclick=()=>$('win').classList.remove('open');
// confetti
const cv=$('fx'),cx=cv.getContext('2d');let parts=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',size);size();
function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#3FC7EE','#FFC23D','#FF8A4C','#9BE15D','#F3F7FF'];
  for(let k=0;k<n;k++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:6+Math.random()*7,c:cols[k%5],r:Math.random()*6,life:90+Math.random()*40});
  if(parts.length===n)requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}
renderTeams();renderBoard();
</script>
</body>
</html>
